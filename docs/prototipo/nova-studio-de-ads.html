<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio de Ads · NOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --line:#e5e7eb; --line2:#f1f5f9; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
  --accent:#0d9488; --accent-ink:#0f766e; --accent-bg:#e6f7f4;
  --tofu:#075985; --tofu-bg:#e0f2fe; --tofu-line:#bae6fd;
  --mofu:#5b21b6; --mofu-bg:#ede9fe; --mofu-line:#ddd6fe;
  --bofu:#065f46; --bofu-bg:#d1fae5; --bofu-line:#a7f3d0;
  --red:#b91c1c; --red-bg:#fee2e2; --amber:#92400e; --amber-bg:#fef3c7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:14px;height:14px}

.app{display:flex;height:100vh;overflow:hidden}
.side{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 12px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.logo b{display:block;font-size:15px}.logo span{font-size:12px;color:var(--muted)}
.prod{display:flex;flex-direction:column;gap:6px;padding:0 4px 8px}
.prod label{font-size:12px;color:var(--muted);font-weight:600}
.prod select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;font-weight:700}
.grp{font-size:12px;font-weight:600;color:var(--faint);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:9px;border:0;background:none;color:#475569;font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--line2);color:var(--ink)}
.nav.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line2)}
.side-foot button{height:34px;border:0;background:none;color:var(--muted);text-align:left;padding:0 12px;border-radius:8px;font-size:13px}
.side-foot button:hover{background:var(--line2);color:var(--ink)}

.main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.top{height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.top h1{margin:0;font-size:20px;font-weight:800}.top p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.top .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.body{flex-grow:1;min-height:0;overflow:auto;padding:20px 24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--ink2);border:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.TOFU{background:var(--tofu-bg);color:var(--tofu)}.chip.MOFU{background:var(--mofu-bg);color:var(--mofu)}.chip.BOFU{background:var(--bofu-bg);color:var(--bofu)}
.chip.ang{background:#fff7ed;color:#9a3412}
.chip.win{background:var(--bofu-bg);color:var(--bofu)}.chip.lose{background:var(--red-bg);color:var(--red)}.chip.warn{background:var(--amber-bg);color:var(--amber)}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px;background:#fff;width:100%}
.field textarea{height:auto;padding:8px 10px;resize:vertical;min-height:70px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.empty{border:1px dashed #cbd5e1;border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 12px;height:38px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input.cell{width:84px;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;text-align:right}

/* thumbs */
.thumb{position:relative;background:#1e293b;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;left:6px;bottom:6px;background:rgba(15,23,42,.8);color:#fff;border-radius:6px;font-size:11px;font-weight:600;padding:2px 6px;display:flex;align-items:center;gap:4px}
.thumb .count{position:absolute;right:6px;top:6px;background:rgba(15,23,42,.8);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px}

/* drop */
.drop{border:1.5px dashed #94a3b8;border-radius:12px;background:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.drop .ic{width:40px;height:40px;border-radius:10px;background:var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
kbd{font:600 12px Inter;background:var(--line2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

/* análisis y fatiga */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi>span{font-size:12px;color:var(--muted);font-weight:600}.kpi b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.delta{font-weight:700}.delta.up{color:var(--red)}.delta.down{color:var(--bofu)}
.kpi em:not(.inv) .delta.up{color:var(--bofu)}.kpi em:not(.inv) .delta.down{color:var(--red)}
.an-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.h2{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.lead{margin:0 0 10px;line-height:1.5;color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.callout{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:#f8fafc}
.callout b{font-size:14px}.callout span{font-size:13px;color:var(--ink2);line-height:1.45}
.callout.warn{background:#fff7ed;border-color:#fed7aa}.callout.ok{background:#f0fdf4;border-color:#bbf7d0}
.tbl td{white-space:nowrap}.tbl tr.core td:nth-child(2){box-shadow:inset 3px 0 0 var(--accent)}
.cumbar{display:inline-block;width:46px;height:6px;background:var(--line2);border-radius:99px;margin-right:6px;vertical-align:middle;overflow:hidden}.cumbar i{display:block;height:100%;background:var(--ink)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0}.stack i{display:block;height:100%}
.fgroup{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.frow{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow.open{border-color:#94a3b8}
.fmain{display:grid;grid-template-columns:48px minmax(200px,2fr) 170px 120px 100px 90px minmax(160px,1.4fr);gap:14px;align-items:center;width:100%;border:0;background:none;padding:10px 14px;text-align:left}
.fmain:hover{background:#f8fafc}
.fthumb{width:48px;height:62px}.fthumb .thumb{height:62px}
.fname{display:flex;flex-direction:column;gap:2px;min-width:0}.fname b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fname span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fidx .bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;margin-bottom:5px}.fidx .bar i{display:block;height:100%}.fidx span{font-size:12px;color:var(--ink2)}
.fcol{display:flex;flex-direction:column;gap:3px}.fcol small{font-size:12px;color:var(--muted)}
.fact{font-size:13px;font-weight:600;color:var(--ink)}
.fdet{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;padding:14px 16px 16px;border-top:1px solid var(--line2);background:#fbfcfd}
.whys{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.45;font-size:13px}.whys .aviso{color:var(--amber)}
.apbar{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin-top:6px}.apbar div{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}.apbar i{display:block;height:100%;background:#f97316}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.an-grid,.fdet{grid-template-columns:1fr}.fmain{grid-template-columns:48px minmax(160px,1fr) 150px 110px 90px}.fmain .fact,.fmain .fcol:nth-of-type(3){display:none}}
/* biblioteca */
.fsel{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:13px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.libcard{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.libcard:hover{border-color:#94a3b8}
.libcard .thumb{border-radius:0}
.libcard .lb{padding:10px;display:flex;flex-direction:column;gap:5px}
.libcard .lb b{font-size:14px}
.hookline{font-size:12px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hoverv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prog{display:flex;flex-direction:column;gap:4px}
.prog[hidden]{display:none}
.prog .bar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prog span{font-size:11px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:560px}
.rleft{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:#fbfcfd;border-radius:0 0 0 14px}
.rright{padding:16px 18px;max-height:78vh;overflow-y:auto}
.rplayer{background:#0f172a;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:240px}
.rplayer video,.rplayer img{width:100%;max-height:520px;display:block;object-fit:contain}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:300px;overflow-y:auto}
.frames button{border:0;padding:0;background:#0f172a;border-radius:6px;overflow:hidden;position:relative}
.frames img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover}
.frames span{position:absolute;left:3px;bottom:3px;background:rgba(15,23,42,.8);color:#fff;font-size:10px;border-radius:4px;padding:1px 4px}
.tl{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tlr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tlf{border:0;padding:0;background:#0f172a;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-self:flex-start;color:#fff;cursor:pointer}
.tlf img{width:72px;height:128px;object-fit:cover;display:block}
.tlf span{font-size:11px;font-weight:600;padding:3px 0;text-align:center;background:#0f172a}
/* refs */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.refcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.refcard .thumb{aspect-ratio:9/13}
.refcard.sel .thumb{outline:3px solid var(--accent);outline-offset:2px}
.split{display:flex;gap:16px;align-items:flex-start}
.detail{width:340px;flex-shrink:0;position:sticky;top:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.detail .preview{border-radius:10px;overflow:hidden;background:#0f172a;max-height:340px;display:flex;justify-content:center}
.detail .preview img,.detail .preview video{max-width:100%;max-height:340px;display:block}

/* kanban */
.kanban{display:flex;gap:14px;align-items:flex-start;min-width:max-content}
.col{width:248px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;border-radius:12px;padding:4px;min-height:200px}
.col.over{background:#e2e8f0}
.colh{display:flex;align-items:center;gap:8px;height:26px;padding:0 4px}
.colh .dot{width:8px;height:8px;border-radius:50%}
.colh b{font-size:14px}.colh span{color:var(--muted);font-size:13px}
.colsub{font-size:12px;color:var(--muted);padding:0 4px;margin-top:-6px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:grab;text-align:left;padding:0;width:100%}
.pcard:hover{border-color:#cbd5e1}
.pcard.dragging{opacity:.4}
.pcard .thumb{height:132px;border-radius:0}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px}
.pcard .row{display:flex;align-items:center;gap:6px}
.pcard .id{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.pcard .t{font-size:14px;font-weight:700;line-height:1.3}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-top:1px solid var(--line2);padding-top:8px;font-size:12px}
.mets b{display:block;font-size:13px}

/* board */
.boardwrap{display:flex;gap:14px;height:100%;min-height:640px}
.tray{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:12px;overflow-y:auto}
.tray.over{background:#f8fafc;outline:2px dashed #cbd5e1}
.board{position:relative;flex-grow:1;border-radius:14px;overflow:hidden;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));border:1px solid var(--line);min-width:760px;user-select:none}
.lane{position:relative;border-bottom:1px solid var(--line);display:flex}
.lane:last-child{border-bottom:0}
.lane.TOFU{background:#f5fbff}.lane.MOFU{background:#faf8ff}.lane.BOFU{background:#f4fdf8}
.lane.hot.TOFU{background:var(--tofu-bg)}.lane.hot.MOFU{background:var(--mofu-bg)}.lane.hot.BOFU{background:var(--bofu-bg)}
.lanehead{width:230px;flex-shrink:0;padding:14px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);background:rgba(255,255,255,.7);position:relative;z-index:1;overflow-y:auto}
.lanehead b{font-size:15px}.lanehead p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.lanehead select,.lanehead input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:13px;width:100%}
.auds{display:flex;flex-wrap:wrap;gap:5px}
.auds .chip{height:auto;min-height:24px;white-space:normal;padding:3px 8px;line-height:1.3}
.auds .chip button{border:0;background:none;padding:0;margin-left:2px;color:inherit;opacity:.6;font-size:13px;line-height:1}
.bitem{position:absolute;z-index:2;width:128px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.06);cursor:grab;touch-action:none}
.bitem .thumb{height:84px;border-radius:0}
.bitem .bb{padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.bitem .bb b{font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bitem .bb span{font-size:11px;color:var(--muted)}
.titem{position:relative;cursor:grab;touch-action:none;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;gap:8px;align-items:center;padding:6px}
.titem .thumb{width:44px;height:56px;flex-shrink:0;border-radius:6px}
.titem b{font-size:12px;line-height:1.25}
.ghost-drag{position:fixed;pointer-events:none;z-index:1000;opacity:.9;transform:rotate(-2deg);box-shadow:0 12px 30px rgba(15,23,42,.25)}
.lanecount{position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted);font-weight:600;z-index:1}

/* angles */
.angles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{padding:16px;display:flex;flex-direction:column;gap:10px}
.acard h3{margin:0;font-size:16px}
.acard p{margin:0;color:var(--ink2);line-height:1.5}
.acard .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2);padding-top:10px}
.acard .stats b{color:var(--ink);font-size:14px;margin-right:3px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:500;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:980px;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh b{font-size:16px}
.mb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:18px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 14px 14px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gallery .g{position:relative}
.gallery .thumb{aspect-ratio:1/1}
.gallery .g .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:7px;border:0;background:rgba(15,23,42,.8);color:#fff;font-size:14px}
.gallery .g.cover .thumb{outline:2px solid var(--accent);outline-offset:1px}
.section-t{font-size:13px;font-weight:700;color:var(--ink);margin:4px 0 -2px}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer{position:fixed;inset:0;background:rgba(2,6,23,.85);z-index:800;display:flex;align-items:center;justify-content:center;padding:24px}
.viewer img,.viewer video{max-width:92vw;max-height:88vh;border-radius:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:900;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

  <div class="main">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Motor del Predictor de fatiga (skill predictor-de-fatiga) */
/*
 * Motor de fatiga creativa — Predictor de Fatiga · Esnidier Ruiz
 * Una sola fuente de verdad para la lógica: lo usa el dashboard (navegador)
 * y el resumen en texto (Node). Si cambias un umbral aquí, cambia en ambos.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MotorFatiga = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ───────────────────────── Configuración ─────────────────────────
  const CONFIG_BASE = {
    minDiasVida: 7,            // antes de 7 días de vida solo se observa
    minImpresiones: 2000,      // impresiones mínimas en el periodo actual
    minImpresionesPrevio: 1000,// impresiones mínimas en el periodo previo
    minDiasEntrega: 4,
    minImpDiaTendencia: 200,   // un día cuenta para la tendencia si tuvo al menos esto
    // desgaste = CTR actual contra su propio pico; ctr = contra el periodo anterior
    pesos: { desgaste: 0.24, ctr: 0.18, tendencia: 0.10, frecuencia: 0.16, alcance: 0.12, cpc: 0.12, hook: 0.08 },
    // [variación donde la señal empieza a sumar, variación donde llega al máximo]
    rampas: {
      desgaste: [0.10, 0.40], ctr: [0.05, 0.30], tendencia: [0.05, 0.30], frecuencia: [0.04, 0.22],
      alcance: [0.05, 0.30], cpc: [0.05, 0.30], hook: [0.05, 0.25]
    },
    cortes: { fatigado: 65, desarrollo: 45, temprana: 25 },
    caidaCtrFatiga: 0.30,      // fatiga = CTR 30% por debajo de su pico sostenido
    caidaCtrSevera: 0.45,      // 45% bajo el pico = fatigado aunque el resto se vea bien
    margenLimite: 0.25,        // hasta 25% peor que el objetivo = "en el límite"
    escaladoFuerte: 0.50,      // +50% de inversión = efecto escalado
    recortePresupuesto: -0.25, // -25% de inversión = recorte relevante
    subastaCara: 0.15,         // CPM de toda la cuenta +15% = mercado más caro
    frecAcumuladaAlta: { prospeccion: 3, retargeting: 6 }
  };

  const ETAPAS = {
    fatigado:   { nombre: 'Fatigado', orden: 4 },
    desarrollo: { nombre: 'Fatiga en desarrollo', orden: 3 },
    temprana:   { nombre: 'Señales tempranas', orden: 2 },
    sano:       { nombre: 'Sano', orden: 1 },
    sin_datos:  { nombre: 'Sin datos suficientes', orden: 0 }
  };

  const RENDIMIENTO = {
    rinde: 'Rinde', limite: 'En el límite', no_rinde: 'No rinde', sin_datos: 'Sin datos'
  };

  // Matriz de decisión: etapa × rendimiento → acción.
  // Regla madre: un anuncio que rinde NO se apaga. Se monitorea y se le prepara relevo.
  const MATRIZ = {
    sano: {
      rinde:     { id: 'escalar',   grupo: 'sanos',      texto: 'Mantener y considerar escalar' },
      limite:    { id: 'mantener',  grupo: 'sanos',      texto: 'Mantener' },
      no_rinde:  { id: 'revisar',   grupo: 'revisar',    texto: 'Revisar mensaje u oferta (no es fatiga)' },
      sin_datos: { id: 'mantener',  grupo: 'sanos',      texto: 'Mantener' }
    },
    temprana: {
      rinde:     { id: 'monitorear', grupo: 'monitoreo', texto: 'Monitorear y preparar variantes' },
      limite:    { id: 'preparar',   grupo: 'semana',    texto: 'Preparar reemplazo' },
      no_rinde:  { id: 'preparar',   grupo: 'semana',    texto: 'Preparar reemplazo y bajarle prioridad' },
      sin_datos: { id: 'monitorear', grupo: 'monitoreo', texto: 'Monitorear' }
    },
    desarrollo: {
      rinde:     { id: 'monitorear', grupo: 'monitoreo', texto: 'No apagar: monitoreo cada 48 h y variantes ya' },
      limite:    { id: 'lanzar',     grupo: 'semana',    texto: 'Lanzar reemplazo esta semana' },
      no_rinde:  { id: 'reemplazar', grupo: 'ya',        texto: 'Reemplazar ahora' },
      sin_datos: { id: 'lanzar',     grupo: 'semana',    texto: 'Lanzar reemplazo esta semana' }
    },
    fatigado: {
      rinde:     { id: 'rotar',      grupo: 'monitoreo', texto: 'No apagar todavía: lanzar relevo y rotar cuando pruebe' },
      limite:    { id: 'reemplazar', grupo: 'ya',        texto: 'Reemplazar ahora' },
      no_rinde:  { id: 'apagar',     grupo: 'ya',        texto: 'Apagar y reemplazar' },
      sin_datos: { id: 'reemplazar', grupo: 'ya',        texto: 'Reemplazar ahora' }
    },
    sin_datos: {
      rinde:     { id: 'esperar', grupo: 'esperar', texto: 'Esperar más datos' },
      limite:    { id: 'esperar', grupo: 'esperar', texto: 'Esperar más datos' },
      no_rinde:  { id: 'esperar', grupo: 'esperar', texto: 'Esperar más datos' },
      sin_datos: { id: 'esperar', grupo: 'esperar', texto: 'Esperar más datos' }
    }
  };

  // ───────────────────────── Utilidades ─────────────────────────
  const DIA = 86400000;
  const aNum = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DIA;
  const aFecha = (n) => new Date(n * DIA).toISOString().slice(0, 10);
  const div = (a, b) => (b > 0 && isFinite(a)) ? a / b : null;
  const pct = (a, b) => (a == null || b == null || b === 0) ? null : a / b - 1;
  const ramp = (x, r) => x == null ? null : Math.max(0, Math.min(1, (x - r[0]) / (r[1] - r[0])));
  const fmtPct = (x) => x == null ? '—' : (x > 0 ? '+' : '') + Math.round(x * 100) + '%';
  const fmtAbs = (x) => x == null ? '—' : Math.abs(Math.round(x * 100)) + '%';
  const verbo = (x, sube, baja) => (x || 0) >= 0 ? sube : baja;

  function vacio() {
    return { gasto: 0, imp: 0, alcance: 0, clics: 0, res: 0, valor: 0, v3s: 0, impV3s: 0, dias: 0 };
  }
  function sumar(acc, r) {
    acc.gasto += r.gasto || 0;
    acc.imp += r.impresiones || 0;
    acc.alcance += r.alcance || 0;
    acc.clics += r.clics || 0;
    acc.res += r.resultados || 0;
    acc.valor += r.valor || 0;
    if (r.vistas_3s != null) { acc.v3s += r.vistas_3s; acc.impV3s += r.impresiones || 0; }
    if ((r.impresiones || 0) > 0) acc.dias++;
    return acc;
  }
  function metricas(a) {
    return {
      gasto: a.gasto, impresiones: a.imp, alcance: a.alcance, clics: a.clics,
      resultados: a.res, valor: a.valor, dias: a.dias,
      ctr: div(a.clics, a.imp),
      cpc: div(a.gasto, a.clics),
      cpm: a.imp > 0 ? a.gasto / a.imp * 1000 : null,
      frecuencia: div(a.imp, a.alcance),          // proxy: impresiones / alcance diario sumado
      hook: a.impV3s > 0 ? a.v3s / a.impV3s : null,
      cpa: div(a.gasto, a.res),
      roas: div(a.valor, a.gasto),
      alcancePorGasto: div(a.alcance, a.gasto)
    };
  }

  function ols(pts) {
    const n = pts.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
    for (const p of pts) { sx += p.x; sy += p.y; sxx += p.x * p.x; sxy += p.x * p.y; syy += p.y * p.y; }
    const den = n * sxx - sx * sx;
    if (den === 0) return null;
    const m = (n * sxy - sx * sy) / den;
    const b = (sy - m * sx) / n;
    const vy = n * syy - sy * sy;
    const r2 = vy > 0 ? Math.pow(n * sxy - sx * sy, 2) / (den * vy) : 0;
    return { m, b, r2 };
  }

  // CTR suavizado: media móvil de 3 días ponderada por impresiones
  function ctrSuavizado(rows, minImp) {
    const pts = [];
    for (let i = 0; i < rows.length; i++) {
      let c = 0, im = 0;
      for (let j = Math.max(0, i - 2); j <= i; j++) { c += rows[j].clics || 0; im += rows[j].impresiones || 0; }
      if ((rows[i].impresiones || 0) >= minImp && im > 0) pts.push({ x: rows[i]._d, y: c / im });
    }
    return pts;
  }

  function inferirEtapa(a) {
    const t = [a.campana, a.conjunto, a.nombre].filter(Boolean).join(' ');
    if (/(lookalike|\blal\b|similar|broad|abierto|amplio)/i.test(a.conjunto || '')) return 'prospeccion';
    return /(rmk|remarketing|retarget|\brt\b|\bbof\b|caliente|carrito|visitantes|abandono|interactu|engag|clientes actuales)/i.test(t)
      ? 'retargeting' : 'prospeccion';
  }

  // ───────────────────────── Preparación (se cachea) ─────────────────────────
  function preparar(datos) {
    const porAnuncio = new Map();
    let minD = Infinity, maxD = -Infinity;
    for (const r of datos.diario) {
      const d = aNum(r.fecha);
      r._d = d;
      if (d < minD) minD = d;
      if (d > maxD) maxD = d;
      if (!porAnuncio.has(r.ad_id)) porAnuncio.set(r.ad_id, []);
      porAnuncio.get(r.ad_id).push(r);
    }
    for (const arr of porAnuncio.values()) arr.sort((a, b) => a._d - b._d);

    const info = new Map((datos.anuncios || []).map((a) => [a.id, Object.assign({}, a)]));
    for (const id of porAnuncio.keys()) if (!info.has(id)) info.set(id, { id, nombre: id });

    for (const [id, arr] of porAnuncio) {
      const a = info.get(id);
      const primera = arr.find((r) => (r.impresiones || 0) > 0);
      const dPrimera = primera ? primera._d : null;
      a._primera = a.fecha_inicio ? Math.min(aNum(a.fecha_inicio), dPrimera ?? Infinity) : dPrimera;
      if (!a.formato) a.formato = arr.some((r) => (r.vistas_3s || 0) > 0) ? 'video' : 'imagen';
      if (!a.etapa) a.etapa = inferirEtapa(a);
      if (!a.nombre) a.nombre = id;
    }
    const campanas = [...new Set([...info.values()].map((a) => a.campana).filter(Boolean))].sort();
    return { porAnuncio, info, minD, maxD, campanas };
  }

  // ───────────────────────── Tendencias ─────────────────────────
  function tendenciaVentana(diarios, L, cfg) {
    const pts = ctrSuavizado(diarios, cfg.minImpDiaTendencia);
    if (pts.length < 5) return null;
    const f = ols(pts);
    if (!f) return null;
    const media = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    if (!media) return null;
    return { m: f.m, r2: f.r2, cambioRel: f.m * (L - 1) / media };
  }

  // Predicción: ¿en cuántos días el CTR cruza el umbral de fatiga (30% bajo su pico)?
  function prediccion(rows, hasta, cfg) {
    const hist = rows.filter((r) => r._d <= hasta && (r.impresiones || 0) > 0);
    if (hist.length < 7) return null;

    // pico sostenido: mejor CTR de 7 días calendario con muestra decente
    let pico = null;
    for (let i = 0; i < hist.length; i++) {
      let c = 0, im = 0;
      for (let j = i; j >= 0 && hist[j]._d > hist[i]._d - 7; j--) { c += hist[j].clics || 0; im += hist[j].impresiones || 0; }
      if (im >= 1500 && hist[i]._d - hist[0]._d >= 2) { const v = c / im; if (pico == null || v > pico) pico = v; }
    }
    // CTR actual: últimos 7 días
    let c7 = 0, i7 = 0;
    for (const r of hist) if (r._d > hasta - 7) { c7 += r.clics || 0; i7 += r.impresiones || 0; }
    const actual = i7 > 0 ? c7 / i7 : null;
    if (pico == null || actual == null) return null;
    const umbral = pico * (1 - cfg.caidaCtrFatiga);

    const recientes = hist.filter((r) => r._d > hasta - 21);
    const pts = ctrSuavizado(recientes, cfg.minImpDiaTendencia);
    const f = pts.length >= 5 ? ols(pts) : null;
    const base = { pico, umbral, actual, caidaDesdePico: actual / pico - 1, puntos: pts };

    if (actual <= umbral) return Object.assign(base, { estado: 'cruzado', dias: 0, confianza: f ? nivel(f.r2) : 'baja', ajuste: f });
    if (!f) return Object.assign(base, { estado: 'sin_tendencia', dias: null, confianza: 'baja', ajuste: null });
    if (f.m >= 0) return Object.assign(base, { estado: 'estable', dias: null, confianza: nivel(f.r2), ajuste: f });
    const dias = Math.max(1, Math.round((actual - umbral) / -f.m));
    return Object.assign(base, { estado: dias > 60 ? 'lejano' : 'proyectado', dias, confianza: nivel(f.r2), ajuste: f });
  }
  const nivel = (r2) => r2 >= 0.5 ? 'alta' : r2 >= 0.25 ? 'media' : 'baja';

  // ───────────────────────── Rendimiento ─────────────────────────
  function rendimiento(m, meta, ref) {
    const tipo = meta.metrica_rectora === 'roas' ? 'roas' : 'cpa';
    const obj = Number(meta.objetivo) > 0 ? Number(meta.objetivo) : ref[tipo];
    if (!obj) return { estado: 'sin_datos', ratio: null, tipo };
    if (tipo === 'roas') {
      if (!m.roas) return { estado: m.gasto >= ref.gastoMedio ? 'no_rinde' : 'sin_datos', ratio: m.gasto >= ref.gastoMedio ? 0 : null, tipo };
      const ratio = m.roas / obj; // >1 cumple
      return { estado: ratio >= 1 ? 'rinde' : ratio >= 1 / (1 + ref.margen) ? 'limite' : 'no_rinde', ratio, tipo };
    }
    if (!m.resultados) {
      const malo = m.gasto >= 2 * obj;
      return { estado: malo ? 'no_rinde' : 'sin_datos', ratio: malo ? 0 : null, tipo };
    }
    const ratio = obj / m.cpa; // >1 cumple
    return { estado: ratio >= 1 ? 'rinde' : ratio >= 1 / (1 + ref.margen) ? 'limite' : 'no_rinde', ratio, tipo };
  }

  // ───────────────────────── Análisis de un anuncio ─────────────────────────
  function evaluarAnuncio(a, rows, ctx) {
    const { cfg, desde, hasta, pDesde, L } = ctx;
    const A = vacio(), P = vacio(), diariosA = [];
    for (const r of rows) {
      if (r._d > hasta) break;
      if (r._d >= desde) { sumar(A, r); diariosA.push(r); }
      else if (r._d >= pDesde) sumar(P, r);
    }
    if (A.imp === 0) return null;

    const ma = metricas(A), mp = metricas(P);
    const diasVida = a._primera != null ? hasta - a._primera + 1 : null;
    const d = {
      ctr: pct(ma.ctr, mp.ctr), cpc: pct(ma.cpc, mp.cpc), cpm: pct(ma.cpm, mp.cpm),
      frecuencia: pct(ma.frecuencia, mp.frecuencia), alcance: pct(ma.alcance, mp.alcance),
      gasto: pct(ma.gasto, mp.gasto), hook: pct(ma.hook, mp.hook), cpa: pct(ma.cpa, mp.cpa),
      roas: pct(ma.roas, mp.roas), resultados: pct(ma.resultados, mp.resultados)
    };
    const mercado = ctx.dCpmCuenta ?? 0;

    // Alcance normalizado por presupuesto y por mercado:
    // si el presupuesto baja 30% y el alcance baja 30%, esto da 0 (no hay señal).
    const alcanceAjustado = (d.alcance != null && d.gasto != null)
      ? ((1 + d.alcance) / (1 + d.gasto)) * (1 + mercado) - 1 : null;
    // CPC que no explica el mercado: si toda la cuenta encareció 15%, eso se descuenta.
    const cpcCreativo = d.cpc != null ? (1 + d.cpc) / (1 + mercado) - 1 : null;

    const tend = tendenciaVentana(diariosA, L, cfg);
    const pred = prediccion(rows, hasta, cfg);
    const s = {
      desgaste: pred ? ramp(-pred.caidaDesdePico, cfg.rampas.desgaste) : null,
      ctr: ramp(d.ctr == null ? null : -d.ctr, cfg.rampas.ctr),
      tendencia: tend ? ramp(-tend.cambioRel, cfg.rampas.tendencia) * Math.min(1, tend.r2 / 0.3) : null,
      frecuencia: ramp(d.frecuencia, cfg.rampas.frecuencia),
      alcance: ramp(alcanceAjustado == null ? null : -alcanceAjustado, cfg.rampas.alcance),
      cpc: ramp(cpcCreativo, cfg.rampas.cpc),
      hook: a.formato === 'video' ? ramp(d.hook == null ? null : -d.hook, cfg.rampas.hook) : null
    };
    if (a.frecuencia_acumulada) {
      const lim = cfg.frecAcumuladaAlta[a.etapa] || 3;
      if (a.frecuencia_acumulada > lim) {
        s.frecuencia = Math.max(s.frecuencia || 0, Math.min(1, 0.5 + (a.frecuencia_acumulada - lim) / lim));
      }
    }

    const avisos = [];
    if (d.gasto != null && d.gasto >= cfg.escaladoFuerte) {
      avisos.push({ tipo: 'escalado', texto: `La inversión subió ${fmtAbs(d.gasto)}: parte del alza de CPC y frecuencia es efecto del escalado, no del creativo.` });
      if (s.cpc != null) s.cpc *= 0.7;
      if (s.alcance != null) s.alcance *= 0.7;
      if (s.frecuencia != null) s.frecuencia *= 0.8;
    }
    if (d.gasto != null && d.gasto <= cfg.recortePresupuesto) {
      avisos.push({ tipo: 'recorte', texto: `La inversión bajó ${fmtAbs(d.gasto)} y el alcance ${verbo(d.alcance, 'subió', 'bajó')} ${fmtAbs(d.alcance)}. Una caída de alcance proporcional al presupuesto es normal y no se cuenta como fatiga.` });
    }
    if (mercado >= cfg.subastaCara) {
      avisos.push({ tipo: 'mercado', texto: `El CPM de toda la cuenta subió ${fmtAbs(mercado)}. Ese encarecimiento se descontó del CPC y del alcance de este anuncio.` });
    }

    // Índice ponderado (las señales que no existen redistribuyen su peso)
    let tot = 0, wsum = 0;
    for (const k in cfg.pesos) if (s[k] != null) { tot += cfg.pesos[k] * s[k]; wsum += cfg.pesos[k]; }
    let indice = wsum > 0 ? Math.round(100 * tot / wsum) : null;
    const aportes = {};
    for (const k in cfg.pesos) aportes[k] = s[k] != null && wsum > 0 ? Math.round(100 * cfg.pesos[k] * s[k] / wsum) : null;

    // Sin caída en la respuesta al creativo no se declara fatiga creativa: es audiencia.
    const respuestaCae = (s.desgaste || 0) >= 0.3 || (s.ctr || 0) >= 0.2 || (s.hook || 0) >= 0.2 || (s.tendencia || 0) >= 0.4;
    const presionAudiencia = (s.frecuencia || 0) >= 0.5 || (s.alcance || 0) >= 0.5;
    let causa = null;
    if (indice != null) {
      if (!respuestaCae && presionAudiencia) {
        causa = 'audiencia';
        if (indice >= cfg.cortes.desarrollo) indice = cfg.cortes.desarrollo - 1;
      } else if (respuestaCae && indice >= cfg.cortes.temprana) causa = 'creativo';
    }

    // Sin periodo previo, un anuncio con 14+ días en el rango se juzga contra su propio pico y su tendencia
    const sinPrevio = P.imp < cfg.minImpresionesPrevio;
    const soloPropio = sinPrevio && A.dias >= 14 && pred != null;
    if (soloPropio) avisos.push({ tipo: 'sin_previo', texto: 'No hay periodo anterior con datos: este diagnóstico se basa en su CTR contra su propio pico y en su tendencia dentro del rango.' });
    const muestraOk = A.imp >= cfg.minImpresiones && (!sinPrevio || soloPropio) && A.dias >= Math.min(cfg.minDiasEntrega, L);
    const vidaOk = diasVida == null || diasVida >= cfg.minDiasVida;
    let etapa;
    let motivoSinDatos = null;
    if (!vidaOk) motivoSinDatos = `Tiene ${diasVida} días de vida: antes de ${cfg.minDiasVida} solo se observa.`;
    else if (sinPrevio && !soloPropio) motivoSinDatos = 'No tiene periodo anterior suficiente para comparar ni historia para medir su pico.';
    else if (!muestraOk) motivoSinDatos = 'Muestra insuficiente en el periodo (impresiones o días de entrega).';
    if (motivoSinDatos || indice == null) etapa = 'sin_datos';
    else if (indice >= cfg.cortes.fatigado) etapa = 'fatigado';
    else if (indice >= cfg.cortes.desarrollo) etapa = 'desarrollo';
    else if (indice >= cfg.cortes.temprana) etapa = 'temprana';
    else etapa = 'sano';

    // Piso por desgaste: si el CTR ya perdió 30% de su pico, la fatiga es un hecho
    if (etapa !== 'sin_datos' && pred) {
      if (pred.caidaDesdePico <= -cfg.caidaCtrSevera) etapa = 'fatigado';
      else if (pred.estado === 'cruzado' && (etapa === 'sano' || etapa === 'temprana')) etapa = 'desarrollo';
      // Predictivo: si cruza el umbral en 10 días o menos con tendencia confiable, ya es señal temprana
      else if (pred.estado === 'proyectado' && pred.dias <= 10 && pred.confianza !== 'baja' && etapa === 'sano') etapa = 'temprana';
    }
    if (etapa === 'sin_datos') indice = null;
    else if (etapa !== 'sano' && indice < (cfg.cortes[etapa] || 0)) indice = cfg.cortes[etapa]; // el índice refleja la etapa final

    const rend = rendimiento(ma, ctx.meta, ctx.ref);
    let accion = MATRIZ[etapa][rend.estado];
    if (causa === 'audiencia' && (etapa === 'sano' || etapa === 'temprana')) {
      accion = { id: 'audiencia', grupo: rend.estado === 'no_rinde' ? 'semana' : 'monitoreo', texto: 'Creativo sano, audiencia saturándose: amplía público antes de tocar el creativo' };
    }

    // Razones legibles, ordenadas por peso
    const razones = [];
    const add = (k, txt) => { if ((s[k] || 0) >= 0.2) razones.push({ k, peso: aportes[k] || 0, texto: txt }); };
    if (pred) add('desgaste', `El CTR de los últimos 7 días está ${fmtAbs(pred.caidaDesdePico)} por debajo de su mejor momento (pico de ${(pred.pico * 100).toLocaleString(ctx.meta.locale || 'es-CO', { maximumFractionDigits: 2 })}%).`);
    add('ctr', `El CTR bajó ${fmtAbs(d.ctr)} contra el periodo anterior.`);
    add('tendencia', `Dentro del periodo el CTR viene en picada: ${fmtAbs(tend && tend.cambioRel)} de punta a punta.`);
    add('frecuencia', a.frecuencia_acumulada && s.frecuencia >= 0.5 && (d.frecuencia || 0) < 0.04
      ? `La frecuencia acumulada va en ${a.frecuencia_acumulada.toFixed(1)}: alta para ${a.etapa === 'retargeting' ? 'retargeting' : 'prospección'}.`
      : `La frecuencia subió ${fmtAbs(d.frecuencia)}: la misma gente lo está viendo más veces.`);
    add('alcance', `El alcance por cada peso invertido cayó ${fmtAbs(alcanceAjustado)}, ya descontando presupuesto y mercado.`);
    add('cpc', `El CPC subió ${fmtAbs(cpcCreativo)} más de lo que explica el mercado.`);
    add('hook', `El hook rate cayó ${fmtAbs(d.hook)}: menos gente se detiene en los primeros 3 segundos.`);
    razones.sort((x, y) => y.peso - x.peso);
    if (causa === 'audiencia') razones.push({ k: 'causa', peso: 0, texto: 'El CTR se sostiene: el creativo sigue funcionando y lo que se agota es la audiencia. Amplía público o abre un conjunto nuevo antes de tocar el creativo.' });

    return {
      id: a.id, nombre: a.nombre, campana: a.campana || '', conjunto: a.conjunto || '',
      formato: a.formato, etapaEmbudo: a.etapa, preview: a.preview_url || null,
      diasVida, actual: ma, previo: mp, deltas: d, alcanceAjustado, cpcCreativo,
      tendencia: tend, senales: s, aportes, indice, etapa, causa, motivoSinDatos,
      rendimiento: rend, accion, prediccion: pred, avisos, razones
    };
  }

  // ───────────────────────── Análisis completo ─────────────────────────
  function analizar(prep, meta, opts) {
    opts = opts || {};
    const cfg = Object.assign({}, CONFIG_BASE, opts.config || {});
    const hasta = opts.hasta != null ? opts.hasta : prep.maxD;
    const desde = opts.desde != null ? opts.desde : hasta - (opts.dias || 14) + 1;
    const L = hasta - desde + 1;
    const pHasta = desde - 1, pDesde = desde - L;
    const f = opts.filtros || {};
    const pasa = (a) => (!f.campana || a.campana === f.campana) && (!f.formato || a.formato === f.formato) && (!f.etapa || a.etapa === f.etapa);

    // Mercado: CPM de TODA la cuenta (sin filtros) actual vs previo
    const mA = vacio(), mP = vacio();
    // Serie diaria de lo filtrado (actual + previo)
    const serie = new Map();
    for (let d = pDesde; d <= hasta; d++) serie.set(d, vacio());
    const tA = vacio(), tP = vacio();
    for (const [id, rows] of prep.porAnuncio) {
      const a = prep.info.get(id);
      const ok = pasa(a);
      for (const r of rows) {
        if (r._d < pDesde || r._d > hasta) continue;
        if (r._d >= desde) sumar(mA, r); else sumar(mP, r);
        if (!ok) continue;
        sumar(serie.get(r._d), r);
        if (r._d >= desde) sumar(tA, r); else sumar(tP, r);
      }
    }
    const cuentaActual = metricas(tA), cuentaPrevia = metricas(tP);
    const dCpmCuenta = pct(metricas(mA).cpm, metricas(mP).cpm);

    const nAnunciosActivos = [...prep.porAnuncio.keys()].filter((id) => pasa(prep.info.get(id))).length || 1;
    const ref = {
      cpa: cuentaActual.cpa, roas: cuentaActual.roas,
      gastoMedio: cuentaActual.gasto / nAnunciosActivos, margen: cfg.margenLimite
    };
    const ctx = { cfg, desde, hasta, pDesde, L, dCpmCuenta, meta, ref };

    const anuncios = [];
    for (const [id, rows] of prep.porAnuncio) {
      const a = prep.info.get(id);
      if (!pasa(a)) continue;
      const r = evaluarAnuncio(a, rows, ctx);
      if (r) anuncios.push(r);
    }

    // Distribución por etapa (conteo y gasto)
    const dist = {};
    for (const k in ETAPAS) dist[k] = { n: 0, gasto: 0 };
    for (const a of anuncios) { dist[a.etapa].n++; dist[a.etapa].gasto += a.actual.gasto; }

    // Grupos del plan de acción
    const grupos = { ya: [], semana: [], monitoreo: [], revisar: [], sanos: [], esperar: [] };
    for (const a of anuncios) grupos[a.accion.grupo].push(a);
    for (const g in grupos) grupos[g].sort((x, y) => (y.indice || 0) - (x.indice || 0));

    // Serie diaria + direcciones de la cuenta
    const dias = [], diasPrev = [];
    for (let d = desde; d <= hasta; d++) dias.push(Object.assign({ fecha: aFecha(d), d }, metricas(serie.get(d))));
    for (let d = pDesde; d <= pHasta; d++) diasPrev.push(Object.assign({ fecha: aFecha(d), d }, metricas(serie.get(d))));
    const kpis = ['gasto', 'alcance', 'impresiones', 'frecuencia', 'ctr', 'cpc', 'cpm', 'resultados', 'cpa', 'roas'];
    const direccion = {};
    for (const k of kpis) {
      const delta = pct(cuentaActual[k], cuentaPrevia[k]);
      const pts = dias.filter((x) => x[k] != null && x.impresiones > 0).map((x, i) => ({ x: i, y: x[k] }));
      const fit = pts.length >= 4 ? ols(pts) : null;
      const media = pts.length ? pts.reduce((s2, p) => s2 + p.y, 0) / pts.length : 0;
      const dentro = fit && media ? fit.m * (L - 1) / media : null;
      direccion[k] = {
        delta,
        vsPrevio: delta == null ? 'sin_dato' : Math.abs(delta) < 0.05 ? 'estable' : delta > 0 ? 'sube' : 'baja',
        dentro,
        dentroTexto: dentro == null ? 'sin_dato' : Math.abs(dentro) < 0.08 || (fit && fit.r2 < 0.15) ? 'estable' : dentro > 0 ? 'ascendente' : 'descendente'
      };
    }

    // ¿El alcance sigue al presupuesto? (descontando el encarecimiento del mercado)
    const dG = direccion.gasto.delta, dAl = direccion.alcance.delta;
    const merc = dCpmCuenta || 0;
    const brecha = (dG != null && dAl != null) ? ((1 + dAl) / (1 + dG)) * (1 + merc) - 1 : null;
    const notaMerc = Math.abs(merc) >= 0.05 ? ` (ya descontando que el CPM de la cuenta ${verbo(merc, 'subió', 'bajó')} ${fmtAbs(merc)})` : '';
    const frase = `La inversión ${verbo(dG, 'subió', 'bajó')} ${fmtAbs(dG)} y el alcance ${verbo(dAl, 'subió', 'bajó')} ${fmtAbs(dAl)}`;
    let veredictoAlcance = 'Sin periodo previo suficiente para comparar alcance y presupuesto.';
    let alcanceEstado = 'neutro';
    if (brecha != null) {
      if (brecha <= -0.10) {
        veredictoAlcance = `${frase}. El alcance cae más de lo que explica el presupuesto${notaMerc}: hay saturación o desgaste.`;
        alcanceEstado = 'riesgo';
      } else if ((1 + dAl) / (1 + dG) - 1 <= -0.10 && merc >= 0.05) {
        veredictoAlcance = `${frase}. El alcance cae más que la inversión, pero la diferencia la explica el mercado: el CPM de la cuenta subió ${fmtAbs(merc)}. No hay señal de saturación.`;
        alcanceEstado = 'vigilar';
      } else if (dG <= -0.10) {
        veredictoAlcance = `${frase}. La caída de alcance va en proporción al presupuesto${notaMerc}: es normal, no es fatiga.`;
        alcanceEstado = 'ok';
      } else if (brecha >= 0.10) {
        veredictoAlcance = `${frase}. El alcance rinde más que la inversión${notaMerc}: estás llegando a gente nueva de forma eficiente.`;
        alcanceEstado = 'ok';
      } else {
        veredictoAlcance = `${frase}. Se mueven en proporción${notaMerc}: no hay señal de saturación en la cuenta.`;
        alcanceEstado = 'ok';
      }
    }

    const analizados = anuncios.filter((a) => a.etapa !== 'sin_datos');
    const gastoFatiga = dist.fatigado.gasto + dist.desarrollo.gasto;
    const resumen = {
      totalAnuncios: anuncios.length,
      analizados: analizados.length,
      accionYa: grupos.ya.length,
      accionSemana: grupos.semana.length,
      monitoreo: grupos.monitoreo.length,
      pctGastoEnFatiga: cuentaActual.gasto > 0 ? gastoFatiga / cuentaActual.gasto : 0,
      reemplazos: grupos.ya.length + grupos.semana.length,
      variantes: grupos.monitoreo.length + grupos.sanos.filter((a) => a.accion.id === 'escalar').length,
      proximos: anuncios
        .filter((a) => a.prediccion && a.prediccion.estado === 'proyectado' && a.etapa !== 'fatigado')
        .sort((x, y) => x.prediccion.dias - y.prediccion.dias).slice(0, 5)
    };

    return {
      rango: { desde: aFecha(desde), hasta: aFecha(hasta), dias: L, previoDesde: aFecha(pDesde), previoHasta: aFecha(pHasta) },
      coberturaPrevia: Math.max(0, Math.min(pHasta, prep.maxD) - Math.max(pDesde, prep.minD) + 1) / L,
      mercado: { dCpm: dCpmCuenta, caro: (dCpmCuenta || 0) >= cfg.subastaCara },
      cuenta: { actual: cuentaActual, previo: cuentaPrevia, direccion, dias, diasPrev, brecha, veredictoAlcance, alcanceEstado },
      anuncios, distribucion: dist, grupos, resumen, cfg
    };
  }

  return { CONFIG_BASE, ETAPAS, RENDIMIENTO, MATRIZ, preparar, analizar, aNum, aFecha, fmtPct, fmtAbs };
});

    r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);});},
  get(store,key){return new Promise((res,rej)=>{const r=this.db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  put(store,val,key){return this.tx(store,'readwrite',s=>s.put(val,key));},

};

function makeThumb(file){
  return new Promise(resolve=>{
    const done=(thumb,meta={})=>resolve({thumb,...meta});
    const draw=(src,w,h)=>{const max=420;const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78);};
    const url=URL.createObjectURL(file);
    if(file.type.startsWith('image/')){
      const img=new Image();img.onload=()=>{const t=draw(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(url);done(t,{w:img.naturalWidth,h:img.naturalHeight});};
      img.onerror=()=>{URL.revokeObjectURL(url);done(null);};img.src=url;
    }else if(file.type.startsWith('video/')){
      const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';
      let fired=false;const fail=setTimeout(()=>{if(!fired){fired=true;URL.revokeObjectURL(url);done(null);}},8000);
      v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/3);};
      v.onseeked=()=>{if(fired)return;fired=true;clearTimeout(fail);let t=null;try{t=draw(v,v.videoWidth,v.videoHeight);}catch(e){}
        const meta={w:v.videoWidth,h:v.videoHeight,duration:v.duration};URL.revokeObjectURL(url);done(t,meta);};
      v.onerror=()=>{if(fired)return;fired=true;clearTimeout(fail);URL.revokeObjectURL(url);done(null);};
      v.src=url;
    }else{URL.revokeObjectURL(url);done(null);}
  });
}
async function addMedia(file){

async function loadWhisper(model,onProgress){
  if(LIBS.whisper&&LIBS.whisper.model===model)return LIBS.whisper.pipe;
  const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
  const opts={progress_callback:p=>{if(p.status==='progress'&&p.total)onProgress(p.loaded/p.total);}};
  let pipe;
  try{ if(navigator.gpu){ pipe=await T.pipeline('automatic-speech-recognition',`onnx-community/whisper-${model}`,{...opts,device:'webgpu'}); } }catch(e){ pipe=null; }
  if(!pipe) pipe=await T.pipeline('automatic-speech-recognition',`onnx-community/whisper-${model}`,opts);
  LIBS.whisper={model,pipe}; return pipe;
}

function seekTo(v,t){return new Promise(res=>{const on=()=>{v.removeEventListener('seeked',on);res();};v.addEventListener('seeked',on);v.currentTime=Math.min(t,Math.max(0,(v.duration||t)-0.05));});}
async function captureFrames(blob,onStep){
  const url=URL.createObjectURL(blob); const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('El navegador no pudo abrir este video'));});
  const dur=v.duration||0; const step=Math.min(3,Math.max(1,dur/30)); const out=[];
  const small=document.createElement('canvas'), big=document.createElement('canvas');
  for(let t=Math.min(.3,dur/2); t<dur && out.length<40; t+=step){
    await seekTo(v,t);
    const w=v.videoWidth,h=v.videoHeight; if(!w)continue;
    small.width=180; small.height=Math.round(h*180/w); small.getContext('2d').drawImage(v,0,0,small.width,small.height);
    big.width=Math.min(900,w); big.height=Math.round(h*big.width/w); big.getContext('2d').drawImage(v,0,0,big.width,big.height);
    const bc=document.createElement('canvas'); bc.width=big.width; bc.height=big.height; bc.getContext('2d').drawImage(big,0,0);
    out.push({t,thumb:small.toDataURL('image/jpeg',.7),canvas:bc});
    onStep(out.length/Math.max(1,Math.ceil(dur/step)));
  }
  URL.revokeObjectURL(url); return {frames:out,duration:dur};
}
async function audioMono16k(blob){
  const buf=await blob.arrayBuffer(); const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx({sampleRate:16000}); try{ const a=await ctx.decodeAudioData(buf);
    if(a.numberOfChannels===1)return a.getChannelData(0);

  const ex=ref.extract, dur=ex.duration||0; const tr=ex.transcript||[], oc=ex.ocr||[];
  const frameAt=t=>{let best=0;(ex.frames||[]).forEach((f,i)=>{if(Math.abs(f.t-t)<Math.abs(ex.frames[best].t-t))best=i;});return ex.frames.length?best:-1;};

async function runExtract(ref,{voz=true,texto=true}={}){
  ensureRef(ref); if(JOBS[ref.id])return; if(!ref.mediaId){toast('Adjunta primero el archivo de este anuncio');return;}
  const m=await DB.get('media',ref.mediaId); if(!m||!m.blob){toast('El archivo original no está en este navegador');return;}
  const ex=ref.extract; ex.status='procesando';
  try{
    if(m.kind==='image'){
      setJob(ref.id,'ocr',10,'Leyendo texto de la imagen…');
      const img=await createImageBitmap(m.blob); const c=document.createElement('canvas'); c.width=Math.min(1200,img.width); c.height=Math.round(img.height*c.width/img.width); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const w=await loadOCR(); setJob(ref.id,'ocr',50,'Leyendo texto de la imagen…');
      const {data}=await w.recognize(c); const txt=cleanOCR(data.text);
      ex.frames=[{t:0,thumb:thumbCache[ref.mediaId]?.thumb||''}]; ex.ocr=txt?[{t:0,text:txt}]:[]; ex.transcript=[]; ex.duration=0;
      ex.blocks=[{id:uid('b'),tipo:'Hook',tiempo:'',start:0,voz:'',texto:txt,visual:'',frame:0}];
    }else{
      setJob(ref.id,'frames',2,'Sacando fotogramas…');
      const {frames,duration}=await captureFrames(m.blob,p=>setJob(ref.id,'frames',2+p*23,`Sacando fotogramas… ${Math.round(p*100)}%`));
      ex.duration=duration; ex.frames=frames.map(f=>({t:f.t,thumb:f.thumb}));
      ex.transcript=[];
      if(voz){
        setJob(ref.id,'audio',27,'Leyendo el audio…');
        let audio=null; try{audio=await audioMono16k(m.blob);}catch(e){toast('No se pudo leer el audio: se extrae solo el texto en pantalla');}
        if(audio){
          const pipe=await loadWhisper(S.settings.whisper||'base',p=>setJob(ref.id,'model',28+p*12,`Descargando modelo de voz (solo la primera vez)… ${Math.round(p*100)}%`));
          setJob(ref.id,'asr',42,'Transcribiendo la voz… puede tardar un poco');
          const out=await pipe(audio,{language:'spanish',task:'transcribe',return_timestamps:true,chunk_length_s:30,stride_length_s:5});
          ex.transcript=(out.chunks||[{timestamp:[0,duration],text:out.text||''}]).map(c=>({start:c.timestamp[0]||0,end:c.timestamp[1]??duration,text:String(c.text||'').trim()})).filter(c=>c.text);
        }
      }
      ex.ocr=[];
      if(texto){
        const w=await loadOCR(); let prev='';
        for(let i=0;i<frames.length;i++){
          setJob(ref.id,'ocr',62+36*(i/frames.length),`Leyendo texto en pantalla… ${i+1}/${frames.length}`);
          const {data}=await w.recognize(frames[i].canvas); const txt=cleanOCR(data.text);
          if(txt&&similar(txt,prev)<.7){ex.ocr.push({t:frames[i].t,text:txt});prev=txt;} else if(!txt) prev='';
        }
      }
      setJob(ref.id,'build',99,'Armando el guion…');
      ex.blocks=buildBlocks(ref);
    }
    ex.status='listo'; ex.at=Date.now(); if(!ref.format)ref.format=m.kind==='image'?'imagen':(ex.transcript.length?'video':'video_texto');
    save(); toast('Guion extraído');
  }catch(err){ console.error(err); ex.status='error'; ex.error=err.message; save(); toast('No se pudo extraer: '+err.message); }
  finally{ endJob(ref.id); if(UI.view==='referencias')render(); if(UI.refOpen===ref.id)renderRefModal(); }
}

function dropZone(text){return `<div class="drop" id="drop">

function wireDrop(piece=null){
  const d=$('#drop'); if(!d)return;
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});

  const f=(FORMATS.find(x=>x[0]===p.format)||FORMATS[0])[3]; const n=(p.code.match(/\d+/)||['1'])[0].padStart(3,'0');
  return `AD_${prod().code}_${angS}_${f}_${n}_A`; }
const BLOCK_TYPES=['Hook','Problema','Agitación','Demostración','Prueba / testimonio','Beneficio','Comparación','Objeción','Oferta','CTA'];
const TEMPLATES={
  video:[['Hook','0–3 s'],['Problema','3–8 s'],['Demostración','8–18 s'],['Prueba / testimonio','18–24 s'],['Oferta','24–28 s'],['CTA','28–30 s']],

    video:'Video vertical con voz (UGC con celular). 20–30 segundos. Cada bloque lleva voz, texto en pantalla de 2 a 3 palabras y la toma a grabar.',

## Pieza

${ref?`- Referencia de inspiración: ${ref.brand||'sin marca'} (${ref.source}). Lo que rescato: ${ref.notes||'—'}${ref.extract?.analysis?.por_que?' Por qué funciona: '+ref.extract.analysis.por_que:''}\n`:''}- Datos del producto y oferta: ${pr.brief?pr.brief.replace(/\n+/g,' · '):'[completa aquí: beneficios reales, precio, packs, garantía]'}

## Reglas
- Español peruano natural, como habla la gente (pichanga, chimpún, pata cuando encaje). Nada de tono de comercial de TV.
- Sin promesas médicas ni palabras como "cura", "protege" o "protección". Habla de soporte, estabilidad y comodidad.

${actuales.length?`\n## Borrador actual (mejóralo, no lo ignores)\n${actuales.map((b,i)=>`${i+1}. [${b.tipo}${b.tiempo?' · '+b.tiempo:''}] voz: ${b.voz||'—'} | texto: ${b.texto||'—'} | visual: ${b.visual||'—'}`).join('\n')}\n`:''}
${ref?.extract?.blocks?.length?`## Guion de la referencia (toma la estructura, NO copies las frases)\n${ref.extract.blocks.map((b,i)=>`${i+1}. [${b.tipo||'—'} · ${b.tiempo||''}] voz: ${b.voz||'—'} | texto: ${b.texto||'—'}`).join('\n')}\n\n`:''}## Formato de respuesta
Responde SOLO con un JSON válido, sin texto antes ni después, con esta forma:
{
  "bloques": [
    {"tipo": "Hook | Problema | Agitación | Demostración | Prueba / testimonio | Beneficio | Comparación | Objeción | Oferta | CTA", "tiempo": "0–3 s", "voz": "", "texto_pantalla": "", "visual": ""}

}`;
}
function parseAI(text){
  let t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}'); if(a<0||b<0)throw new Error('No encontré un JSON en la respuesta');
  return JSON.parse(t.slice(a,b+1));
}

}

function boardPos(p){const idx=STAGES.indexOf(p.stage);const cl=v=>Math.max(0,Math.min(1,Number(v)||0));const x=cl(p.board.x),y=cl(p.board.y);

function boardItem(p){

  return `<div class="bitem" data-id="${p.id}" style="${boardPos(p)}" tabindex="0" role="button" aria-label="${esc(p.code)} en ${p.stage}. Doble clic para abrir">
    ${thumbHTML(p.mediaIds[0],p.format==='imagen'?'Imagen':'Video')}
    <div class="bb"><b>${esc(p.title)}</b><span>${esc(p.code)}${ang?' · '+esc(ang.name):''}</span></div></div>`;
}
function wireBoard(){
  const board=$('#board'),tray=$('#tray');
  const laneAt=(x,y)=>{const els=[...board.querySelectorAll('.lane')];return els.find(l=>{const r=l.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});};
  const headW=230;
  function startDrag(el,e,fromTray){
    if(e.button!==0)return; e.preventDefault();
    const id=el.dataset.id;const p=byId(S.pieces,id);
    const r=el.getBoundingClientRect();const offX=e.clientX-r.left,offY=e.clientY-r.top;
    const ghost=el.cloneNode(true);ghost.classList.add('ghost-drag');ghost.style.width=(fromTray?140:r.width)+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';
    if(fromTray){ghost.className='bitem ghost-drag';ghost.innerHTML=boardItem({...p,board:{x:0,y:0},stage:'TOFU'}).replace(/^<div[^>]*>|<\/div>$/g,'');}
    document.body.appendChild(ghost);hydrateThumbs(ghost);el.style.opacity='.35';
    let moved=false;let hot=null;
    const move=ev=>{moved=true;ghost.style.left=(ev.clientX-offX)+'px';ghost.style.top=(ev.clientY-offY)+'px';
      const l=laneAt(ev.clientX,ev.clientY);if(hot!==l){hot?.classList.remove('hot');hot=l;hot?.classList.add('hot');}
      const tr=tray.getBoundingClientRect();tray.classList.toggle('over',ev.clientX>=tr.left&&ev.clientX<=tr.right&&ev.clientY>=tr.top&&ev.clientY<=tr.bottom);};
    const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost.remove();el.style.opacity='';hot?.classList.remove('hot');tray.classList.remove('over');
      if(!moved){ if(!fromTray)return; }
      const tr=tray.getBoundingClientRect();
      if(ev.clientX>=tr.left&&ev.clientX<=tr.right&&ev.clientY>=tr.top&&ev.clientY<=tr.bottom){ if(p.stage){p.stage='';p.board=null;save();render();toast('Pieza sin etapa');} return; }
      const l=laneAt(ev.clientX,ev.clientY); if(!l){return;}
      const br=board.getBoundingClientRect();
      const lr=l.getBoundingClientRect();const cl=v=>Math.max(0,Math.min(1,v));
      const x=cl((ev.clientX-offX-(br.left+238))/Math.max(1,br.width-238-140));
      const y=cl((ev.clientY-offY-(lr.top+8))/Math.max(1,lr.height-166));
      const prev=p.stage; p.stage=l.dataset.stage; p.board={x,y}; save(); render();
      if(prev!==p.stage)toast(`${p.code} ahora está en ${p.stage}`);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  }
  board.querySelectorAll('.bitem').forEach(el=>{
    el.addEventListener('pointerdown',e=>startDrag(el,e,false));
    el.addEventListener('dblclick',()=>openModal(el.dataset.id));
    el.addEventListener('keydown',e=>{if(e.key==='Enter')openModal(el.dataset.id);});
  });
  tray.querySelectorAll('.titem').forEach(el=>{
    el.addEventListener('pointerdown',e=>startDrag(el,e,true));
    el.addEventListener('dblclick',()=>openModal(el.dataset.id));
  });
}

/* ============ DATOS DE META (importación) ============ */
const ALIAS_META={
  fecha:['dia','day','fecha','date','date_start','inicio del informe','reporting starts','fecha de inicio del informe'],
  ad_id:['identificador del anuncio','id del anuncio','ad id','ad_id'],
  nombre:['nombre del anuncio','ad name','ad_name','anuncio'],
  campana:['nombre de la campana','campaign name','campaign_name','campana'],
  conjunto:['nombre del conjunto de anuncios','ad set name','adset_name','conjunto de anuncios','nombre del conjunto'],
  gasto:['importe gastado','amount spent','amount_spent','spend','gasto','inversion','importe gastado total'],
  impresiones:['impresiones','impressions'], alcance:['alcance','reach'],
  clics:['clics en el enlace','link clicks','link_click','inline_link_clicks','clics en enlaces','clics'],
  resultados:['resultados','results'],
  valor:['valor de conversion de compras','purchases conversion value','valor de los resultados','valor de conversion'],
  vistas_3s:['reproducciones de video de 3 segundos','reproducciones de 3 segundos del video','3-second video plays','3 second video plays','video_play_actions']
};
const normH=t=>String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\((cop|usd|mxn|eur|pen|clp|ars)\)/g,'').replace(/\s+/g,' ').trim();
function numMeta(v,miles){ if(v==null)return 0; if(typeof v==='number')return v; let s=String(v).trim().replace('%','').replace(/[$\s\u00a0]|S\//g,''); if(!s||s==='-'||s==='—')return 0;
  if(miles&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  else if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.includes(',')){const p=s.split(',');s=p.length===2&&p[1].length<=2?s.replace(',','.'):s.replace(/,/g,'');}
  const n=parseFloat(s); return isNaN(n)?0:n; }
function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); const first=text.split(/\r?\n/)[0]; const del=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true; else if(c===del){row.push(cur);cur='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(x=>x!==''))rows.push(row); row=[]; } else cur+=c; }
  if(cur!==''||row.length){row.push(cur);if(row.some(x=>x!==''))rows.push(row);}
  return rows;
}
const isoDate=s=>{s=String(s||'').trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return `${m[1]}-${m[2]}-${m[3]}`; m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; return null; };
function csvToDatos(text){
  const rows=parseCSV(text); if(rows.length<2)throw new Error('El CSV está vacío');
  const head=rows[0]; const nh=head.map(normH); const map={};
  for(const [campo,al] of Object.entries(ALIAS_META)){const i=nh.findIndex((h,ix)=>al.includes(h)&&!Object.values(map).includes(ix));if(i>=0)map[campo]=i;}
  if(map.fecha==null)throw new Error('Falta la columna de día: exporta con desglose por día');
  if(map.ad_id==null&&map.nombre==null)throw new Error('Falta el nombre o ID del anuncio: exporta a nivel de anuncio');
  const moneda=/\(pen\)/i.test(head.join(' '))?'PEN':/\(usd\)/i.test(head.join(' '))?'USD':'';
  const agg=new Map(),ads=new Map();

  const counts={};
  const byProd={};

    g.rows.forEach(r=>{const x={fecha:r.fecha,ad_id:String(r.ad_id),gasto:+r.gasto||0,impresiones:+r.impresiones||0,alcance:+r.alcance||0,clics:+r.clics||0,resultados:+r.resultados||0,valor:+r.valor||0};if(r.vistas_3s!=null)x.vistas_3s=+r.vistas_3s||0;rowMap.set(x.ad_id+'|'+x.fecha,x);});

function dailySVG(days,tope){
  const W=420,H=150,pl=8,pr=8,pt=10,pb=18; const n=days.length||1; const bw=(W-pl-pr)/n;
  const maxG=Math.max(1,...days.map(([,v])=>v.g)); const cpas=days.map(([,v])=>v.r?v.g/v.r:null); const maxC=Math.max(tope*1.8,...cpas.filter(Boolean));
  const y=c=>pt+(H-pt-pb)*(1-Math.min(1,c/maxC));
  const line=cpas.map((c,i)=>c==null?null:[pl+bw*i+bw/2,y(c)]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gasto diario y CPA">
    ${days.map(([,v],i)=>{const h=(H-pt-pb)*(v.g/maxG);return `<rect x="${pl+bw*i+bw*.15}" y="${H-pb-h}" width="${bw*.7}" height="${h}" fill="#e2e8f0"><title>${mmBig(v.g)} · ${Math.round(v.r)} res.</title></rect>`;}).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${y(tope)}" y2="${y(tope)}" stroke="#059669" stroke-dasharray="4 3"/>
    <polyline points="${line.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    <text x="${W-pr}" y="${y(tope)-4}" font-size="10" text-anchor="end" fill="#059669">objetivo ${mm(tope)}</text>
    <text x="${pl}" y="${H-4}" font-size="10" fill="#64748b">${MotorFatiga.aFecha(days[0][0]).slice(5)}</text><text x="${W-pr}" y="${H-4}" font-size="10" text-anchor="end" fill="#64748b">${MotorFatiga.aFecha(days[days.length-1][0]).slice(5)}</text>
  </svg><div class="legend" style="margin-top:4px"><span><i style="background:#e2e8f0"></i>Gasto</span><span><i style="background:#0f172a;height:2px"></i>CPA del día</span></div>`;
}

  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=close);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close();});

}
