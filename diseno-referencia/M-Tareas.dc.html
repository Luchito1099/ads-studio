<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas · mobile · noviitools Studio Ads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2f6;overscroll-behavior-y:none}
button,a{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{font-family:inherit;font-size:16px}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #eef2f6; min-height: 100vh; display: flex; flex-direction: column">

<header style="position: sticky; top: 0; z-index: 10; background: #eef2f6; padding: calc(12px + env(safe-area-inset-top)) 16px 8px">
<div style="font-size: 12px; color: #94a3b8">NOVAFLEX · Todos los productos</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Hoy</h1>
<span style="font-size: 13px; color: #64748b">{{summary}}</span>
<button type="button" aria-label="Nueva tarea" onClick="{{openNew}}" style="margin-left: auto; width: 40px; height: 40px; border-radius: 20px; border: none; background: #0d9488; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="hs" style="display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none">
<sc-for list="{{timeTabs}}" as="w" hint-placeholder-count="4">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px">

<a href="Implementacion.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; background: #ffffff; border-radius: 14px; padding: 10px 14px">
<span style="font-size: 12px; font-weight: 700">Meta</span>
<sc-for list="{{goals}}" as="g" hint-placeholder-count="3"><span style="font-size: 12px; color: #64748b">{{g.label}} <b style="font-family: 'JetBrains Mono', monospace; color: {{g.color}}">{{g.n}}</b></span></sc-for>
</a>

<sc-for list="{{groups}}" as="gr" hint-placeholder-count="3">
<section>
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 2px 8px">
<span style="{{gr.dot}}"></span><span style="font-size: 14px; font-weight: 700">{{gr.title}}</span><span style="font-size: 12px; color: #94a3b8">{{gr.meta}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{gr.tasks}}" as="t" hint-placeholder-count="2">
<div style="background: #ffffff; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<span style="{{t.timeChip}}">{{t.time}}</span>
<div style="flex: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 600; line-height: 1.3">{{t.title}}</div>
<div style="font-size: 12.5px; color: #64748b; margin-top: 2px">{{t.why}}</div>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{t.snooze}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; font-size: 13px; font-weight: 600; color: #64748b">Mañana</button>
<sc-if value="{{t.manual}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{t.done}}" style="flex: 1; height: 40px; border-radius: 10px; border: none; background: #0f172a; color: #ffffff; font-size: 13.5px; font-weight: 600">Hecha</button></sc-if>
<sc-if value="{{t.auto}}" hint-placeholder-val="{{true}}"><a href="{{t.href}}" style="flex: 1; height: 40px; border-radius: 10px; background: #0f172a; color: #ffffff; font-size: 13.5px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{t.go}} →</a></sc-if>
</div>
</div>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="background: #ffffff; border-radius: 14px; padding: 28px 16px; text-align: center; font-size: 14px; color: #64748b">{{emptyText}}</div></sc-if>
<div style="font-size: 12px; color: #94a3b8; text-align: center; padding: 4px 0 8px">{{footer}}</div>
</main>

<div style="position: sticky; bottom: 0; z-index: 20"><dc-import name="MobileNav" active="Tareas" hint-size="390px,64px"></dc-import></div>
</div>

<sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #0f172a">
<button type="button" aria-label="Cerrar" onClick="{{closeNew}}" style="position: absolute; inset: 0; border: none; background: rgba(15,23,42,.5); cursor: default"></button>
<div role="dialog" aria-modal="true" aria-label="Nueva tarea" style="position: relative; width: 100%; max-width: 380px; background: #ffffff; border-radius: 18px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Nueva tarea</h2>
<input type="text" value="{{nt.title}}" onInput="{{nt.onTitle}}" placeholder="Qué hay que hacer" aria-label="Qué hay que hacer" style="height: 46px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 11px; padding: 0 12px; outline: none">
<div style="display: flex; gap: 6px"><sc-for list="{{nt.prios}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="display: flex; gap: 6px"><sc-for list="{{nt.times}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
<div style="display: flex; gap: 8px; margin-top: 4px">
<button type="button" onClick="{{closeNew}}" style="flex: 1; height: 46px; border-radius: 11px; border: 1px solid #e2e8f0; background: #ffffff; font-size: 14px; font-weight: 600">Cancelar</button>
<button type="button" onClick="{{saveNew}}" style="flex: 1; height: 46px; border-radius: 11px; border: none; background: #0d9488; color: #ffffff; font-size: 14px; font-weight: 600">Crear</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: fixed; left: 16px; right: 16px; bottom: 84px; z-index: 60; padding: 12px 14px; border-radius: 12px; background: #0f172a; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; line-height: 1.4">{{msg}}</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){
    super(p);
    var t = function(id, prio, min, title, why, href, go, manual){ return { id: id, prio: prio, min: min, title: title, why: why, href: href || '', go: go || 'Ir', manual: !!manual }; };
    this.state = { time: 0, snoozed: {}, doneIds: {}, newOpen: false, nt: null, msg: '',
      tasks: [
        t('t1', 'alta', 10, 'Decidir 4 anuncios en Testing', '2 ya gastaron US$ 38 sin compras', 'M-Testing.dc.html', 'Decidir'),
        t('t3', 'alta', 30, 'Subir SCR_045 a Meta', 'Lleva 1 día lista para lanzar', 'M-Pipeline.dc.html', 'Ver nombres'),
        t('t2', 'alta', 90, 'Preparar reemplazo de EST_056', 'Ganador con frecuencia 2.9', 'M-Pipeline.dc.html', 'Crear pieza'),
        t('t8', 'media', 30, 'Terminar guion de SCR_050', '4 días en Guion', 'M-Pipeline.dc.html', 'Abrir guion'),
        t('t7', 'media', 30, 'Escribir 2 hooks nuevos para SCR_046', 'Ganador: lleva 1 de 3 variaciones', 'M-Hooks.dc.html', 'Ir a Hooks'),
        t('t6', 'media', 90, 'Crear 2 piezas BOFU', 'BOFU va 0/2 esta semana', 'M-Pipeline.dc.html', 'Crear'),
        t('t4', 'media', 90, 'Grabar VO de SCR_049', '3 hooks + body · vencía ayer', 'M-Pipeline.dc.html', 'Ver guion'),
        t('t11', 'baja', 10, 'Sincronizar Excel de Meta', 'Última carga: ayer', 'M-Testing.dc.html', 'Sincronizar'),
        t('t9', 'baja', 10, 'Vincular 4 anuncios sin ID', 'No suman en formato ni ángulo', 'Testing.dc.html', 'Vincular'),
        t('m2', 'baja', 10, 'Guardar utm_content en el formulario', 'Tarea manual', '', '', true)
      ] };
  }
  renderVals() {
    var self = this, S = this.state;
    var PRIO = { alta: ['Alta', '#dc2626'], media: ['Media', '#d97706'], baja: ['Baja', '#94a3b8'] };
    var TIME = { 10: ['10 min', '#f0fdfa', '#0f766e'], 30: ['30 min', '#eff6ff', '#1d4ed8'], 90: ['90 min', '#f5f3ff', '#6d28d9'] };
    var hm = function(m){ var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r : '') : r + ' min'; };
    var flash = function(m){ self.setState({ msg: m }); clearTimeout(self.mt); self.mt = setTimeout(function(){ self.setState({ msg: '' }); }, 2600); };
    var chip = function(m){ return "flex-shrink:0;width:56px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;padding:4px 0;border-radius:7px;background:" + TIME[m][1] + ';color:' + TIME[m][2]; };
    var live = S.tasks.filter(function(x){ return !S.doneIds[x.id] && !S.snoozed[x.id]; });
    var today = live.filter(function(x){ return !S.time || x.min <= S.time; });
    var groups = ['alta','media','baja'].map(function(k){
      var ts = today.filter(function(x){ return x.prio === k; }).sort(function(a, b){ return a.min - b.min; });
      return { title: PRIO[k][0], n: ts.length, meta: '~' + hm(ts.reduce(function(a, x){ return a + x.min; }, 0)), dot: 'width:9px;height:9px;border-radius:5px;background:' + PRIO[k][1],
        tasks: ts.map(function(x){ return { title: x.title, why: x.why, href: x.href, go: x.go, manual: x.manual, auto: !x.manual, time: TIME[x.min][0], timeChip: chip(x.min),
          snooze: function(){ var s = Object.assign({}, S.snoozed); s[x.id] = 1; self.setState({ snoozed: s }); flash('Pasó a mañana.'); },
          done: function(){ var d = Object.assign({}, S.doneIds); d[x.id] = 1; self.setState({ doneIds: d }); flash('Hecha.'); } }; }) };
    }).filter(function(g){ return g.n > 0; });
    var N = S.nt || { title: '', prio: 'media', min: 30 };
    var setNt = function(k, v){ var n = Object.assign({}, N); n[k] = v; self.setState({ nt: n }); };
    var opt = function(on){ return 'flex:1;height:42px;border-radius:10px;font-size:13.5px;font-weight:600;' + (on ? 'border:1.5px solid #0d9488;background:#f0fdfa;color:#0f766e' : 'border:1px solid #e2e8f0;background:#ffffff;color:#475569'); };
    return {
      summary: today.length + ' · ~' + hm(today.reduce(function(a, x){ return a + x.min; }, 0)),
      timeTabs: [[0,'Todo'],[10,'Tengo 10 min'],[30,'30 min'],[90,'90 min']].map(function(w){ var on = S.time === w[0];
        return { label: w[1], on: on, pick: function(){ self.setState({ time: w[0] }); },
          style: 'flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;' + (on ? 'border:none;background:#0f172a;color:#ffffff' : 'border:1px solid #e2e8f0;background:#ffffff;color:#475569') }; }),
      goals: [['TOFU','3/6','#0f172a'],['MOFU','2/3','#0f172a'],['BOFU','0/2','#dc2626']].map(function(g){ return { label: g[0], n: g[1], color: g[2] }; }),
      groups: groups, empty: groups.length === 0, emptyText: S.time ? 'Nada de ' + S.time + ' min o menos.' : 'Nada pendiente hoy.',
      footer: (Object.keys(S.snoozed).length ? Object.keys(S.snoozed).length + ' pospuestas · ' : '') + 'Las automáticas se cierran solas',
      newOpen: S.newOpen,
      nt: { title: N.title, onTitle: function(e){ setNt('title', e.target.value); },
        prios: ['alta','media','baja'].map(function(k){ return { label: PRIO[k][0], style: opt(N.prio === k), pick: function(){ setNt('prio', k); } }; }),
        times: [10,30,90].map(function(m){ return { label: TIME[m][0], style: opt(N.min === m), pick: function(){ setNt('min', m); } }; }) },
      openNew: function(){ self.setState({ newOpen: true, nt: { title: '', prio: 'media', min: 30 } }); },
      closeNew: function(){ self.setState({ newOpen: false }); },
      saveNew: function(){ if (!N.title.trim()) return; self.setState({ tasks: S.tasks.concat([{ id: 'm' + Date.now(), prio: N.prio, min: N.min, title: N.title.trim(), why: 'Tarea manual', href: '', go: '', manual: true }]), newOpen: false }); flash('Tarea creada.'); },
      hasMsg: !!S.msg, msg: S.msg
    };
  }
}
</script>
</body>
</html>
