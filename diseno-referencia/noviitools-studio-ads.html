<template id="tpl-Implementacion">

<div style="font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #eef2f6; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 220px; max-width: 220px; display: flex"><dc-import name="Sidebar" active="Plan de implementación" hint-size="220px,100%"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 18px 26px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div>
<div style="font-size: 11.5px; color: #94a3b8; margin-bottom: 4px">NOVAFLEX / Operación</div>
<h1 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em">Plan de implementación</h1>
<div style="font-size: 12.5px; color: #64748b; margin-top: 3px">Decide el lunes qué sale cada día y comprueba si con eso llegas a la meta.</div>
</div>
<div style="margin-left: auto; display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="Semana anterior" onClick="{{prevWeek}}" style="{{navPrev}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<div style="height: 36px; padding: 0 14px; border: 1px solid #e2e8f0; border-radius: 9px; background: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>{{weekLabel}}</div>
<button type="button" aria-label="Semana siguiente" onClick="{{nextWeek}}" style="{{navNext}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
<a href="#Pipeline" style="height: 36px; padding: 0 14px; border-radius: 9px; background: #0d9488; color: #ffffff; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">Content Pipeline →</a>
</div>
</header>

<!-- VEREDICTO -->
<section style="{{verdict.box}}">
<span style="{{verdict.icon}}">{{verdict.mark}}</span>
<div style="flex: 1 1 320px; min-width: 0">
<div style="font-size: 15px; font-weight: 700">{{verdict.title}}</div>
<div style="font-size: 12.5px; margin-top: 2px; opacity: .85">{{verdict.sub}}</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11.5px">
<span style="opacity: .7">Datos de</span>
<template data-k="for" list="{{sources}}" as="s" hint-placeholder-count="3"><a href="{{s.href}}" title="{{s.tip}}" style="text-decoration: none; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: rgba(255,255,255,.7); color: #0f172a; border: 1px solid rgba(15,23,42,.08)">{{s.label}}</a></template>
</div>
</section>

<!-- KPIs -->
<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
<template data-k="for" list="{{kpis}}" as="k" hint-placeholder-count="6">
<a href="{{k.href}}" style="text-decoration: none; color: inherit; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; display: block">
<div style="font-size: 11.5px; color: #64748b">{{k.label}}</div>
<div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: {{k.color}}">{{k.value}}</span><span style="font-size: 11.5px; font-weight: 600; color: {{k.deltaColor}}">{{k.delta}}</span></div>
<template data-k="if" value="{{k.hasBar}}" hint-placeholder-val="{{true}}"><div style="height: 5px; border-radius: 3px; background: #f1f5f9; margin-top: 8px; overflow: hidden"><div style="{{k.bar}}"></div></div></template>
<div style="font-size: 11px; color: #94a3b8; margin-top: 6px">{{k.sub}}</div>
</a>
</template>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">

<!-- CALENDARIO -->
<section style="flex: 999 1 640px; min-width: 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 10px">
<div><h2 style="margin: 0; font-size: 15px; font-weight: 700">Calendario de lanzamientos</h2><div style="font-size: 12px; color: #94a3b8">Arrastra las piezas para cambiarles el día. Ads y orgánico.</div></div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: #64748b">
<template data-k="for" list="{{legend}}" as="l" hint-placeholder-count="5"><span style="display: inline-flex; align-items: center; gap: 5px"><span style="{{l.dot}}"></span>{{l.label}}</span></template>
</div>
</div>

<template data-k="if" value="{{hasAlerts}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px">
<template data-k="for" list="{{alerts}}" as="a" hint-placeholder-count="2">
<div style="{{a.style}}"><span style="font-weight: 700">{{a.tag}}</span> {{a.text}}</div>
</template>
</div>
</template>

<div style="overflow-x: auto">
<div style="display: grid; grid-template-columns: 92px repeat(7, minmax(96px, 1fr)); gap: 4px; min-width: 800px">
<div></div>
<template data-k="for" list="{{days}}" as="d" hint-placeholder-count="7">
<div style="{{d.head}}">{{d.label}}<span style="display: block; font-size: 10px; font-weight: 600; color: {{d.subColor}}">{{d.sub}}</span></div>
</template>
<template data-k="for" list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="padding: 8px 4px; display: flex; flex-direction: column; justify-content: center">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: {{r.color}}"><span style="{{r.dot}}"></span>{{r.label}}</span>
<span style="font-size: 10.5px; color: #94a3b8; padding-left: 14px">{{r.sub}}</span>
</div>
<template data-k="for" list="{{r.cells}}" as="c" hint-placeholder-count="7">
<div class="cell" onDragOver="{{c.over}}" onDragLeave="{{c.leave}}" onDrop="{{c.drop}}" style="{{c.style}}">
<template data-k="for" list="{{c.items}}" as="x" hint-placeholder-count="1">
<button type="button" class="chip" draggable="true" onDragStart="{{x.drag}}" onClick="{{x.open}}" style="{{x.style}}">
<span style="display: flex; align-items: center; gap: 4px"><span style="font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left">{{x.title}}</span><span style="{{x.mark}}">{{x.markText}}</span></span>
<span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #64748b; text-align: left">{{x.id}}{{x.chText}}</span>
<template data-k="if" value="{{x.conflict}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 9.5px; font-weight: 700; color: #c2410c; text-align: left">{{x.conflictText}}</span></template>
</button>
</template>
<template data-k="if" value="{{c.empty}}" hint-placeholder-val="{{true}}"><span class="addh" style="font-size: 10.5px; color: #cbd5e1; display: flex; align-items: center; justify-content: center; height: 100%">Suelta aquí</span></template>
</div>
</template>
</template>
</div>
</div>

<!-- sin fecha -->
<div onDragOver="{{tray.over}}" onDragLeave="{{tray.leave}}" onDrop="{{tray.drop}}" style="{{tray.style}}">
<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px"><span style="font-size: 12.5px; font-weight: 700">Del Content Pipeline · sin fecha</span><span style="font-size: 11.5px; color: #94a3b8">{{tray.sub}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-k="for" list="{{tray.items}}" as="x" hint-placeholder-count="3">
<button type="button" class="chip" draggable="true" onDragStart="{{x.drag}}" onClick="{{x.open}}" style="{{x.trayStyle}}">
<span style="{{x.stageTag}}">{{x.stage}}</span>
<span style="font-size: 12px; font-weight: 600">{{x.title}}</span>
<span style="font-size: 10.5px; color: #64748b">{{x.stageName}} · {{x.readyText}}</span>
</button>
</template>
<template data-k="if" value="{{tray.empty}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #94a3b8">Todo tiene día asignado.</span></template>
</div>
</div>
</section>

<!-- DERECHA -->
<aside style="flex: 1 1 290px; display: flex; flex-direction: column; gap: 14px">
<section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px">
<div style="display: flex; align-items: center; margin-bottom: 4px"><h2 style="margin: 0; font-size: 14px; font-weight: 700">Meta de la semana</h2><a href="#Main" style="margin-left: auto; font-size: 12px; font-weight: 600; color: #0f766e; text-decoration: none">Cuotas →</a></div>
<div style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px">Lanzadas + programadas contra la cuota</div>
<template data-k="for" list="{{goals}}" as="g" hint-placeholder-count="3">
<div style="padding: 7px 0">
<div style="display: flex; align-items: baseline; font-size: 12.5px"><b style="color: {{g.color}}">{{g.label}}</b><span style="color: #94a3b8; margin-left: 6px; font-size: 11.5px">{{g.sub}}</span><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 600">{{g.n}}</span></div>
<div style="height: 7px; border-radius: 4px; background: #f1f5f9; margin-top: 6px; overflow: hidden; display: flex"><div style="{{g.barDone}}"></div><div style="{{g.barPlan}}"></div></div>
<div style="font-size: 11px; color: {{g.noteColor}}; margin-top: 4px">{{g.note}}</div>
</div>
</template>
</section>

<section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px">
<div style="display: flex; align-items: center; margin-bottom: 4px"><h2 style="margin: 0; font-size: 14px; font-weight: 700">Rutina de la semana</h2><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #475569">{{ritualN}}</span></div>
<div style="height: 5px; border-radius: 3px; background: #f1f5f9; margin: 6px 0 8px; overflow: hidden"><div style="{{ritualBar}}"></div></div>
<template data-k="for" list="{{ritual}}" as="r" hint-placeholder-count="6">
<button type="button" role="checkbox" aria-checked="{{r.on}}" onClick="{{r.toggle}}" style="display: flex; align-items: flex-start; gap: 9px; width: 100%; border: none; background: transparent; padding: 6px 0; text-align: left">
<span style="{{r.box}}"><template data-k="if" value="{{r.on}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></template></span>
<span style="flex: 1; min-width: 0"><span style="{{r.titleStyle}}">{{r.title}}</span><span style="display: block; font-size: 11px; color: #94a3b8">{{r.day}} · {{r.time}}</span></span>
</button>
</template>
</section>
</aside>
</div>
</main>
</div>

<!-- PIEZA -->
<template data-k="if" value="{{pOpen}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #0f172a">
<button type="button" aria-label="Cerrar" onClick="{{pm.close}}" style="position: absolute; inset: 0; border: none; background: rgba(15,23,42,.5); cursor: default"></button>
<div role="dialog" aria-modal="true" aria-label="Pieza" style="position: relative; width: 100%; max-width: 440px; background: #ffffff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden">
<div style="padding: 18px 20px 6px; display: flex; gap: 10px">
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; color: #475569">{{pm.id}}</span><span style="{{pm.stageTag}}">{{pm.stage}}</span><span style="font-size: 11.5px; color: #64748b">{{pm.meta}}</span></div>
<h2 style="margin: 4px 0 0; font-size: 17px; font-weight: 700">{{pm.title}}</h2>
<div style="font-size: 12px; color: #64748b; margin-top: 3px">{{pm.when}}</div>
</div>
<button type="button" aria-label="Cerrar" onClick="{{pm.close}}" style="border: none; background: transparent; font-size: 20px; line-height: 1; color: #94a3b8; align-self: flex-start">×</button>
</div>
<div style="padding: 10px 20px 16px">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<div style="background: #f8fafc; border-radius: 10px; padding: 10px 12px"><div style="font-size: 11px; color: #94a3b8">Etapa en el Pipeline</div><div style="font-size: 14px; font-weight: 700; margin-top: 2px">{{pm.stageName}}</div></div>
<div style="background: #f8fafc; border-radius: 10px; padding: 10px 12px"><div style="font-size: 11px; color: #94a3b8">Estará lista</div><div style="font-size: 14px; font-weight: 700; margin-top: 2px; color: {{pm.readyColor}}">{{pm.ready}}</div></div>
</div>
<template data-k="if" value="{{pm.conflict}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: #c2410c; background: #fff7ed; border-radius: 9px; padding: 8px 10px; margin-top: 8px">{{pm.conflictText}}</div></template>
<div style="font-size: 11.5px; color: #94a3b8; margin-top: 8px">{{pm.hint}}</div>
</div>
<div style="display: flex; gap: 8px; padding: 14px 20px; background: #f8fafc; border-top: 1px solid #f1f5f9">
<template data-k="if" value="{{pm.hasDay}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{pm.unschedule}}" style="height: 36px; padding: 0 12px; border: 1px solid #e2e8f0; border-radius: 9px; background: #ffffff; font-size: 12.5px; font-weight: 600; color: #475569">Quitar fecha</button></template>
<a href="{{pm.href}}" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 9px; background: #0f172a; color: #ffffff; font-size: 12.5px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">{{pm.goLabel}} →</a>
</div>
</div>
</div>
</template>

<template data-k="if" value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: 520px; width: calc(100% - 48px); box-sizing: border-box; padding: 12px 16px; border-radius: 12px; background: #0f172a; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.45; box-shadow: 0 12px 30px rgba(15,23,42,.25)">{{msg}}</div>
</template>
</template>
<template id="tpl-Tareas">

<div style="font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #eef2f6; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 220px; max-width: 220px; display: flex"><dc-import name="Sidebar" active="Tareas" hint-size="220px,100%"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 18px 26px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; max-width: 980px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div>
<div style="font-size: 11.5px; color: #94a3b8; margin-bottom: 4px">NOVAFLEX / Operación</div>
<h1 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em">Tareas</h1>
</div>
<div style="margin-left: auto; display: flex; gap: 8px">
<button type="button" onClick="{{openRules}}" style="height: 36px; padding: 0 12px; border: 1px solid #e2e8f0; border-radius: 9px; background: #ffffff; font-size: 12.5px; font-weight: 600; color: #475569">Reglas</button>
<button type="button" onClick="{{openNew}}" style="height: 36px; padding: 0 12px; border: 1px solid #e2e8f0; border-radius: 9px; background: #ffffff; font-size: 12.5px; font-weight: 600; color: #0f172a">+ Tarea</button>
</div>
</header>

<!-- meta semanal, una línea -->
<a href="#Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; text-decoration: none; color: inherit; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px">
<span style="font-size: 12px; font-weight: 700">Meta de la semana</span>
<template data-k="for" list="{{goals}}" as="g" hint-placeholder-count="4">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #475569">{{g.label}} <b style="font-family: 'JetBrains Mono', monospace; color: {{g.color}}">{{g.n}}</b></span>
</template>
<span style="margin-left: auto; font-size: 11.5px; color: #94a3b8">{{goalSub}}</span>
</a>

<!-- filtros -->
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div role="group" aria-label="Tiempo disponible" style="display: flex; align-items: center; gap: 2px; background: #ffffff; border: 1px solid #e2e8f0; padding: 3px; border-radius: 10px">
<span style="font-size: 12px; color: #64748b; padding: 0 8px">Tengo</span>
<template data-k="for" list="{{timeTabs}}" as="w" hint-placeholder-count="4">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
</template>
</div>
<span style="margin-left: auto; font-size: 12px; color: #64748b">{{summary}}</span>
</div>

<!-- prioridades -->
<template data-k="for" list="{{groups}}" as="gr" hint-placeholder-count="3">
<section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid #f1f5f9">
<span style="{{gr.dot}}"></span>
<span style="font-size: 13.5px; font-weight: 700">{{gr.title}}</span>
<span style="font-size: 12px; color: #94a3b8">{{gr.meta}}</span>
</div>
<template data-k="for" list="{{gr.tasks}}" as="t" hint-placeholder-count="3">
<div class="tr" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid #f8fafc">
<template data-k="if" value="{{t.manual}}" hint-placeholder-val="{{false}}">
<button type="button" role="checkbox" aria-checked="false" aria-label="Marcar hecha" onClick="{{t.done}}" style="width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #cbd5e1; background: #ffffff; flex-shrink: 0; padding: 0"></button>
</template>
<span style="{{t.timeChip}}">{{t.time}}</span>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</div>
<div title="{{t.tip}}" style="font-size: 11.5px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.why}}</div>
</div>
<button type="button" class="snz" onClick="{{t.snooze}}" style="border: none; background: transparent; font-size: 11.5px; font-weight: 600; color: #94a3b8">Mañana</button>
<template data-k="if" value="{{t.hasGo}}" hint-placeholder-val="{{true}}"><a href="{{t.href}}" style="flex-shrink: 0; width: 64px; height: 30px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #e2e8f0; background: #ffffff; color: #0f172a">Ir →</a></template>
<template data-k="if" value="{{t.manual}}" hint-placeholder-val="{{false}}"><span style="width: 64px; flex-shrink: 0"></span></template>
</div>
</template>
</section>
</template>

<template data-k="if" value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="background: #ffffff; border: 1.5px dashed #cbd5e1; border-radius: 14px; padding: 28px; text-align: center; font-size: 13px; color: #64748b">{{emptyText}}</div>
</template>

<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: #94a3b8">
<button type="button" onClick="{{toggleLater}}" style="border: none; background: transparent; padding: 0; font-size: 12px; font-weight: 600; color: #64748b">{{laterLabel}}</button>
<span>{{doneText}}</span>
</div>
<template data-k="if" value="{{showLater}}" hint-placeholder-val="{{false}}">
<section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden">
<template data-k="for" list="{{later}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid #f8fafc">
<span style="{{t.timeChip}}">{{t.time}}</span>
<span style="flex: 1; min-width: 0; font-size: 13px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
<button type="button" onClick="{{t.unsnooze}}" style="border: none; background: transparent; font-size: 11.5px; font-weight: 600; color: #0f766e">Traer a hoy</button>
</div>
</template>
</section>
</template>
</main>
</div>

<!-- REGLAS -->
<template data-k="if" value="{{rulesOpen}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #0f172a">
<button type="button" aria-label="Cerrar" onClick="{{closeRules}}" style="position: absolute; inset: 0; border: none; background: rgba(15,23,42,.5); cursor: default"></button>
<div role="dialog" aria-modal="true" aria-label="Reglas" style="position: relative; width: 100%; max-width: 520px; max-height: calc(100vh - 48px); overflow-y: auto; background: #ffffff; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.3)">
<div style="padding: 18px 20px 6px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Reglas que crean tareas</h2>
<p style="margin: 6px 0 0; font-size: 12.5px; color: #64748b">Cada tarea automática se cierra sola cuando haces lo que pide. Apaga las que te metan ruido.</p>
</div>
<div style="padding: 6px 20px 14px">
<template data-k="for" list="{{rules}}" as="r" hint-placeholder-count="5">

<div style="padding: 14px 16px 10px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 10px">
<div style="flex: 1; min-width: 0">

<div style="font-size: 17px; font-weight: 700; margin-top: 3px; line-height: 1.25">{{pm.title}}</div>
</div>
<button type="button" aria-label="Cerrar" onClick="{{pm.close}}" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: #f1f5f9; color: #475569; font-size: 18px; line-height: 1">×</button>

<template data-k="for" list="{{pm.versions}}" as="v" hint-placeholder-count="3"><button type="button" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button></template>
</div>

<textarea rows="2" value="{{pm.cta}}" onInput="{{pm.onCta}}" style="border: 1px solid #e2e8f0; border-radius: 11px; padding: 10px 12px; resize: none; outline: none; line-height: 1.45"></textarea></label>

</template>
<template data-k="if" value="{{pm.isStatic}}" hint-placeholder-val="{{false}}">

<button type="button" onClick="{{pm.copyBrief}}" style="height: 48px; border-radius: 12px; border: none; background: #0f172a; color: #ffffff; font-size: 15px; font-weight: 600">Copiar brief</button>
</template>
<template data-k="if" value="{{pm.isReady}}" hint-placeholder-val="{{false}}">
<div style="font-size: 12.5px; font-weight: 700">Nombres para Meta</div>
<template data-k="for" list="{{pm.names}}" as="n" hint-placeholder-count="2">

<span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #0f766e; word-break: break-all">{{n.name}}</span>
<button type="button" onClick="{{n.copy}}" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #99f6e4; background: #ffffff; font-size: 13px; font-weight: 600; color: #0f766e">Copiar</button>
</div>
</template>
</template>
</div>

<div style="padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #f1f5f9; display: flex; gap: 8px">
<button type="button" onClick="{{pm.save}}" style="height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid #0d9488; background: #f0fdfa; color: #0f766e; font-size: 14px; font-weight: 600">Guardar</button>
<button type="button" onClick="{{pm.next}}" style="flex: 1; height: 48px; border-radius: 12px; border: none; background: #0d9488; color: #ffffff; font-size: 14px; font-weight: 600">{{pm.nextLabel}}</button>
</div>
</div>
</div>

<div role="status" style="position: fixed; left: 16px; right: 16px; bottom: 84px; z-index: 70; padding: 12px 14px; border-radius: 12px; background: #0f172a; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; line-height: 1.4">{{msg}}</div>
</template>
</template>
<template id="tpl-M-Hooks">

<div style="font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #eef2f6; min-height: 100vh; display: flex; flex-direction: column">

<header style="position: sticky; top: 0; z-index: 10; background: #eef2f6; padding: calc(12px + env(safe-area-inset-top)) 16px 8px">
<div style="font-size: 12px; color: #94a3b8">NOVAFLEX · {{count}} hooks</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Hooks</h1>
<button type="button" aria-label="Nuevo hook" onClick="{{openNew}}" style="margin-left: auto; width: 40px; height: 40px; border-radius: 20px; border: none; background: #0d9488; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 8px; height: 44px; margin-top: 10px; padding: 0 12px; border-radius: 12px; background: #ffffff; color: #94a3b8">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Buscar hook" aria-label="Buscar hook" style="flex: 1; border: none; outline: none; background: transparent; color: #0f172a">
</label>
<div class="hs" style="display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none">
<template data-k="for" list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></template>
</div>
</header>

<main style="flex: 1; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 8px">
<template data-k="for" list="{{list}}" as="h" hint-placeholder-count="5">
<div style="background: #ffffff; border-radius: 14px; padding: 12px 14px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35">{{h.text}}</div>
<button type="button" aria-label="Ganador" aria-pressed="{{h.star}}" onClick="{{h.toggleStar}}" style="width: 36px; height: 36px; flex-shrink: 0; border: none; border-radius: 18px; background: transparent; color: {{h.starColor}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{h.starFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap">
<template data-k="if" value="{{h.hasAngle}}" hint-placeholder-val="{{true}}"><span style="font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: #eef2ff; color: #4338ca">{{h.angle}}</span></template>
<template data-k="if" value="{{h.hasUsed}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: #f1f5f9; color: #475569">En {{h.used}}</span></template>
<template data-k="if" value="{{h.hasHr}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; color: #64748b">Hook rate <b style="font-family: 'JetBrains Mono', monospace; color: #0f172a">{{h.hr}}</b></span></template>
</div>
<div style="display: flex; gap: 8px; margin-top: 10px">
<button type="button" onClick="{{h.copy}}" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; font-size: 13.5px; font-weight: 600; color: #0f172a">{{h.copyLabel}}</button>
<button type="button" onClick="{{h.use}}" style="flex: 1; height: 40px; border-radius: 10px; border: none; background: #0f172a; color: #ffffff; font-size: 13.5px; font-weight: 600">Usar</button>
</div>
</div>
</template>
<template data-k="if" value="{{empty}}" hint-placeholder-val="{{false}}"><div style="background: #ffffff; border-radius: 14px; padding: 24px; text-align: center; font-size: 14px; color: #64748b">No hay hooks con ese filtro.</div></template>
</main>

<div style="position: sticky; bottom: 0; z-index: 20"><dc-import name="MobileNav" active="Hooks" hint-size="390px,64px"></dc-import></div>
</div>

<template data-k="if" value="{{modal}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #0f172a">
<button type="button" aria-label="Cerrar" onClick="{{close}}" style="position: absolute; inset: 0; border: none; background: rgba(15,23,42,.5); cursor: default"></button>
<div role="dialog" aria-modal="true" aria-label="{{mTitle}}" style="position: relative; width: 100%; max-width: 380px; max-height: calc(100vh - 32px); overflow-y: auto; background: #ffffff; border-radius: 18px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">{{mTitle}}</h2>
<template data-k="if" value="{{isNew}}" hint-placeholder-val="{{true}}">
<textarea rows="3" value="{{draft}}" onInput="{{onDraft}}" placeholder="Escribe el hook" aria-label="Hook" style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; resize: none; outline: none; line-height: 1.45"></textarea>
<div style="font-size: 12px; color: #94a3b8">Ángulo (opcional)</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-k="for" list="{{angleOpts}}" as="a" hint-placeholder-count="5"><button type="button" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button></template></div>
<button type="button" onClick="{{saveNew}}" style="height: 48px; border-radius: 12px; border: none; background: #0d9488; color: #ffffff; font-size: 15px; font-weight: 600">Guardar hook</button>
</template>
<template data-k="if" value="{{isUse}}" hint-placeholder-val="{{false}}">
<div style="background: #f8fafc; border-radius: 12px; padding: 12px; font-size: 14.5px; font-weight: 600">“{{useText}}”</div>
<div style="font-size: 12px; color: #94a3b8">Agregar como hook nuevo a</div>
<template data-k="for" list="{{targets}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; color: #475569">{{t.id}}</span>
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
</button>
</template>
<button type="button" onClick="{{newPiece}}" style="height: 46px; border-radius: 12px; border: 1px dashed #99f6e4; background: #f0fdfa; color: #0f766e; font-size: 14px; font-weight: 600">+ Crear pieza nueva con este hook</button>
</template>
<button type="button" onClick="{{close}}" style="height: 40px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #64748b">Cancelar</button>
</div>
</div>
</template>

<template data-k="if" value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: fixed; left: 16px; right: 16px; bottom: 84px; z-index: 70; padding: 12px 14px; border-radius: 12px; background: #0f172a; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; line-height: 1.4">{{msg}}</div>
</template>
</template>

<button type="button" class="op" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: none; border-top: 1px solid #f1f5f9; border-radius: 7px; background: transparent; text-align: left; color: #475569; font-size: 12px">

<script>
(function(){

    if (!cache[name]){
