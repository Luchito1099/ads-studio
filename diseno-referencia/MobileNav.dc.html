<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú inferior · noviitools Studio Ads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,a{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</helmet>
<nav aria-label="Menú principal" style="font-family: Inter, system-ui, sans-serif; width: 100%; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-sizing: border-box">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" style="{{it.style}}">
<span style="position: relative; display: inline-flex">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"/></svg>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -4px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #dc2626; color: #ffffff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.badge}}</span></sc-if>
</span>
<span style="font-size: 10.5px">{{it.label}}</span>
</a>
</sc-for>
<button type="button" onClick="{{openMore}}" style="{{moreStyle}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
<span style="font-size: 10.5px">Más</span>
</button>
</nav>

<sc-if value="{{more}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #0f172a">
<button type="button" aria-label="Cerrar" onClick="{{closeMore}}" style="position: absolute; inset: 0; border: none; background: rgba(15,23,42,.5); cursor: default"></button>
<div role="dialog" aria-modal="true" aria-label="Más" style="position: relative; width: 100%; max-width: 380px; max-height: calc(100vh - 32px); overflow-y: auto; background: #ffffff; border-radius: 18px; padding: 16px; box-sizing: border-box">
<div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px">Marca</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" style="{{b.style}}"><span style="{{b.dot}}"></span>{{b.name}}</button></sc-for>
</div>
<div style="font-size: 11px; color: #94a3b8; margin: 14px 0 6px">Producto</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4"><button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.name}}</button></sc-for>
</div>
<div style="height: 1px; background: #f1f5f9; margin: 14px 0 6px"></div>
<sc-for list="{{rest}}" as="r" hint-placeholder-count="5">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; text-decoration: none; color: #0f172a; font-size: 14px; font-weight: 600; border-bottom: 1px solid #f8fafc">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"/></svg>
<span style="flex: 1">{{r.label}}</span>
<span style="font-size: 11px; font-weight: 500; color: #94a3b8">{{r.hint}}</span>
</a>
</sc-for>
</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Tareas","Pipeline","Testing","Hooks"],"default":"Tareas"},"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { more: false, brand: 'NOVAFLEX', product: 'Todos' }; }
  renderVals() {
    var self = this, S = this.state, active = this.props.active || 'Tareas';
    var NAV = [
      ['Tareas', 'M-Tareas.dc.html', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11', '3'],
      ['Pipeline', 'M-Pipeline.dc.html', 'M3 4h5v16H3zM10 4h5v11h-5zM17 4h4v7h-4z', ''],
      ['Testing', 'M-Testing.dc.html', 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3', '4'],
      ['Hooks', 'M-Hooks.dc.html', 'M4 6h16M4 12h16M4 18h10', '']
    ];
    var cell = function(on){ return 'flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:transparent;text-decoration:none;' + (on ? 'color:#0d9488;font-weight:700' : 'color:#64748b;font-weight:500'); };
    var BR = { 'NOVAFLEX': ['#84cc16', ['Tobillera de compresión', 'Rodillera', 'Muñequera']], 'KLYNEA': ['#0d9488', ['Faja lumbar', 'Corrector de postura', 'Rodillera ortopédica']], 'Nova Shop': ['#4338ca', ['Proyector portátil', 'Mini proyector', 'Pantalla de proyección', 'Soporte de pared', 'Parlante bluetooth', 'Cable HDMI 4K']] };
    var pill = function(on){ return 'height:34px;padding:0 12px;border-radius:17px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;' + (on ? 'border:1.5px solid #0d9488;background:#f0fdfa;color:#0f766e' : 'border:1px solid #e2e8f0;background:#ffffff;color:#475569'); };
    return {
      items: NAV.map(function(n){ return { label: n[0], href: n[1], d: n[2], badge: n[3], hasBadge: !!n[3], style: cell(n[0] === active) }; }),
      moreStyle: cell(false), more: S.more,
      openMore: function(){ self.setState({ more: true }); }, closeMore: function(){ self.setState({ more: false }); },
      brands: Object.keys(BR).map(function(b){ return { name: b, style: pill(S.brand === b), dot: 'width:9px;height:9px;border-radius:3px;background:' + BR[b][0], pick: function(){ self.setState({ brand: b, product: 'Todos' }); } }; }),
      products: ['Todos'].concat(BR[S.brand][1]).map(function(p){ return { name: p, style: pill(S.product === p), pick: function(){ self.setState({ product: p }); } }; }),
      rest: [
        ['Embudo', 'Main.dc.html', 'M3 4h18l-7 9v6l-4 2v-8z', 'Mejor en computadora'],
        ['Biblioteca', 'Referentes.dc.html', 'M12 3v12M7 10l5 5 5-5M4 19h16', '12 sin asignar'],
        ['Ganadores', 'Ganadores.dc.html', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z', ''],
        ['Métricas', 'Metricas.dc.html', 'M4 20V10M10 20V4M16 20v-7M22 20H2', 'Mejor en computadora'],
        ['Plan de implementación', 'Implementacion.dc.html', 'M4 4h16v16H4zM4 9h16M9 4v16', 'Mejor en computadora']
      ].map(function(r){ return { label: r[0], href: r[1], d: r[2], hint: r[3] }; })
    };
  }
}
</script>
</body>
</html>
