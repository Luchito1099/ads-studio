<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sidebar · noviitools Studio Ads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nv:hover{background:#eef2f6}
.op:hover{background:#f1f5f9}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<nav aria-label="noviitools Studio Ads" style="font-family: Inter, system-ui, sans-serif; color: #0f172a; width: 100%; min-height: 100%; height: 100%; background: #f8fafc; border-right: 1px solid #e2e8f0; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">

<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px 14px">
<div style="width: 30px; height: 30px; border-radius: 8px; background: #0f172a; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg>
</div>
<div><div style="font-size: 14px; font-weight: 800; letter-spacing: -0.02em">noviitools</div><div style="font-size: 9px; font-weight: 700; color: #0d9488; letter-spacing: .14em">STUDIO ADS</div></div>
</div>

<!-- BRAND SWITCHER -->
<div style="font-size: 10.5px; color: #94a3b8; padding: 0 8px 5px">Marca</div>
<button type="button" aria-expanded="{{open}}" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 1px solid #e2e8f0; border-radius: 10px; background: #ffffff; text-align: left; color: #0f172a">
<span style="{{cur.mark}}">{{cur.ini}}</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 700">{{cur.name}}</span><span style="display: block; font-size: 10.5px; color: #64748b">{{cur.count}} productos</span></span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
</button>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 4px; border: 1px solid #e2e8f0; border-radius: 10px; background: #ffffff; padding: 4px; box-shadow: 0 8px 20px rgba(15,23,42,.08)">
<sc-for list="{{brandList}}" as="b" hint-placeholder-count="3">
<button type="button" class="op" onClick="{{b.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: none; border-radius: 7px; background: transparent; text-align: left; color: #0f172a">
<span style="{{b.mark}}">{{b.ini}}</span>
<span style="flex: 1; font-size: 12.5px; font-weight: 600">{{b.name}}</span>
<sc-if value="{{b.on}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></sc-if>
</button>
</sc-for>
<button type="button" class="op" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: none; border-top: 1px solid #f1f5f9; border-radius: 7px; background: transparent; text-align: left; color: #475569; font-size: 12px">
<span style="width: 26px; height: 26px; border-radius: 7px; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Nueva marca</button>
</div>
</sc-if>

<!-- PRODUCT FILTER -->
<div style="position: relative; margin-top: 8px">
<sc-if value="{{few}}" hint-placeholder-val="{{true}}">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">
<span style="{{p.thumb}}"></span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #94a3b8">{{p.n}}</span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{many}}" hint-placeholder-val="{{false}}">
<button type="button" aria-expanded="{{prodOpen}}" onClick="{{toggleProd}}" style="{{prodBtn}}">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{curProduct}}</span>
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
<sc-if value="{{prodOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; border: 1px solid #e2e8f0; border-radius: 10px; background: #ffffff; padding: 4px; box-shadow: 0 12px 28px rgba(15,23,42,.14); display: flex; flex-direction: column; gap: 1px">
<sc-if value="{{showSearch}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; margin-bottom: 4px; border-bottom: 1px solid #f1f5f9; color: #94a3b8">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="search" placeholder="Buscar producto" aria-label="Buscar producto" style="border: none; outline: none; background: transparent; font: inherit; font-size: 12px; color: #0f172a; width: 100%">
</label>
</sc-if>
<div style="max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">
<span style="{{p.thumb}}"></span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #94a3b8">{{p.n}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</sc-if>
</div>

<div style="height: 1px; background: #e2e8f0; margin: 12px 4px 4px"></div>

<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<div style="font-size: 10.5px; color: #94a3b8; padding: 10px 10px 4px">{{sec.label}}</div>
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<a class="nv" href="{{it.href}}" style="{{it.style}}">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"/></svg>
<span style="flex: 1">{{it.label}}</span>
<sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 1px 7px; border-radius: 20px; background: #ccfbf1; color: #0f766e">{{it.badge}}</span></sc-if>
</a>
</sc-for>
</sc-for>

<div style="margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #0d9488; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>
<div><div style="font-size: 12px; font-weight: 600">Luchito</div><div style="font-size: 10px; color: #64748b">Dueño</div></div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Embudo","Content Pipeline","Hooks","Biblioteca","Testing","Ganadores","Métricas","Plan de implementación","Tareas"],"default":"Embudo"},"onChange":{"editor":null},"$preview":{"width":220,"height":1120}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { brand: 'NOVAFLEX', product: 'Todos', open: false }; }
  emit(brand, product){ if (typeof this.props.onChange === 'function') this.props.onChange({ brand: brand, product: product }); }
  renderVals() {
    var self = this;
    var BR = {
      'NOVAFLEX': { color: '#84cc16', fg: '#0f172a', products: [['Tobillera de compresión', 16], ['Rodillera', 6], ['Muñequera', 3]] },
      'KLYNEA': { color: '#0d9488', fg: '#ffffff', products: [['Faja lumbar', 9], ['Corrector de postura', 7], ['Rodillera ortopédica', 4]] },
      'Nova Shop': { color: '#4338ca', fg: '#ffffff', products: [['Proyector portátil', 11], ['Mini proyector', 6], ['Pantalla de proyección', 5], ['Soporte de pared', 2], ['Parlante bluetooth', 4], ['Cable HDMI 4K', 1]] }
    };
    var mark = function(b){ return 'width:26px;height:26px;border-radius:7px;flex-shrink:0;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;background:' + BR[b].color + ';color:' + BR[b].fg; };
    var brand = this.state.brand, product = this.state.product;
    var cur = { name: brand, ini: brand.charAt(0), count: BR[brand].products.length, mark: mark(brand) };
    var brandList = Object.keys(BR).map(function(b){
      return { name: b, ini: b.charAt(0), on: b === brand, mark: mark(b),
        pick: function(){ self.setState({ brand: b, product: 'Todos', open: false, prodOpen: false }); self.emit(b, 'Todos'); } };
    });
    var total = BR[brand].products.reduce(function(a, p){ return a + p[1]; }, 0);
    var prodRows = [['Todos los productos', total, 'Todos']].concat(BR[brand].products.map(function(p){ return [p[0], p[1], p[0]]; }));
    var products = prodRows.map(function(p, i){
      var on = product === p[2];
      return { name: p[0], n: p[1],
        pick: function(){ self.setState({ product: p[2], prodOpen: false }); self.emit(brand, p[2]); },
        thumb: i === 0 ? 'width:18px;height:18px;border-radius:5px;flex-shrink:0;border:1.5px solid ' + (on ? '#0d9488' : '#cbd5e1') + ';background:transparent' : 'width:18px;height:18px;border-radius:5px;flex-shrink:0;background:' + (on ? '#99f6e4' : '#e2e8f0'),
        style: 'display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;border:none;text-align:left;font-size:12.5px;' + (on ? 'background:#f0fdfa;color:#0f766e;font-weight:600' : 'background:transparent;color:#475569') };
    });
    var active = this.props.active ?? 'Embudo';
    var mk = function(label, href, d, badge){
      var on = label === active;
      return { label: label, href: href, d: d, badge: badge || false,
        style: 'display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px;text-decoration:none;' + (on ? 'background:#e2e8f0;color:#0f172a;font-weight:600' : 'color:#475569;font-weight:500') };
    };
    var many = true;
    var prodOpen = !!this.state.prodOpen;
    var allP = product === 'Todos';
    return { open: this.state.open, toggle: function(){ self.setState({ open: !self.state.open }); },
      cur: cur, brandList: brandList, products: products,
      few: !many, many: many, prodOpen: prodOpen, showSearch: BR[brand].products.length > 5,
      toggleProd: function(){ self.setState({ prodOpen: !self.state.prodOpen }); },
      curProduct: allP ? 'Todos los productos' : product,
      prodBtn: 'display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:9px;text-align:left;font-size:12.5px;' + (allP ? 'border:1px solid #e2e8f0;background:#ffffff;color:#0f172a' : 'border:1px solid #99f6e4;background:#f0fdfa;color:#0f766e;font-weight:600'),
      sections: [
        { label: 'Creativos', items: [
          mk('Embudo', 'Main.dc.html', 'M3 4h18l-7 9v6l-4 2v-8z'),
          mk('Content Pipeline', 'Pipeline.dc.html', 'M3 4h5v16H3zM10 4h5v11h-5zM17 4h4v7h-4z', '14'),
          mk('Hooks', 'Hooks.dc.html', 'M4 6h16M4 12h16M4 18h10'),
          mk('Biblioteca', 'Referentes.dc.html', 'M12 3v12M7 10l5 5 5-5M4 19h16', '12') ] },
        { label: 'Resultados', items: [
          mk('Testing', 'Testing.dc.html', 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3', '4'),
          mk('Ganadores', 'Ganadores.dc.html', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z'),
          mk('Métricas', 'Metricas.dc.html', 'M4 20V10M10 20V4M16 20v-7M22 20H2') ] },
        { label: 'Operación', items: [
          mk('Plan de implementación', 'Implementacion.dc.html', 'M4 4h16v16H4zM4 9h16M9 4v16'),
          mk('Tareas', 'Tareas.dc.html', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11', '7') ] }
      ] };
  }
}
</script>
</body>
</html>
