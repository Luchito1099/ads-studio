# Alternativa para levantar la app fuera de Coolify (VPS a mano, local, otro PaaS).
#
# En Coolify usa el build pack "Dockerfile", no este archivo: ahí el volumen,
# el dominio, el puerto y las variables se configuran desde la interfaz, y el
# mapeo de puertos de abajo choca con su proxy.
services:
  nova-ads-studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Definir en Coolify (Environment Variables), no acá.
      - APP_PASSWORD=${APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_PATH=/data/nova.db
      - PORT=3000
      # Opcionales: sincronización con Meta, Postgres y S3 (ver .env.example).
      - SYNC_TOKEN=${SYNC_TOKEN:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_SSL=${DATABASE_SSL:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_PREFIX=${S3_PREFIX:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      # Volumen persistente: sin esto se pierde la base SQLite en cada redeploy.
      # Con Postgres sigue sirviendo para la importación inicial.
      - nova-data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nova-data:
