services:
  nova-ads-studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Definir en Coolify (Environment Variables), no acá.
      - APP_PASSWORD=${APP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_PATH=/data/nova.db
      - PORT=3000
    volumes:
      # Volumen persistente: sin esto se pierde la base en cada redeploy.
      - nova-data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nova-data:
